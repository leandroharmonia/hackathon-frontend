<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Hackathon 2026</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <br><br>
  <img src="img/titulo.png" alt="Sistema de evaluacion" class="logo">

  <div class="general">
    <img src="img/Debate.png" alt="Imagen de fondo">
    
    <div class="formulario">
      <br><br>
      <h1>Iniciar sesión</h1>
      <br><br>
      <form method="post" action="" id="login-form">
        <label for="usuario">Usuario / Email: </label>
        <input type="text" id="usuario" name="usuario" placeholder="ejemplo@gmail.com" required>
        <br><br>

        <label for="contrasena">Contraseña: </label>
        <input type="password" id="contrasena" name="contrasena" required>
        <br><br>
        <button type="submit">Siguiente</button>
      </form>

      <!-- Enlaces directos -->
      <br>
      <div style="text-align: center; display: flex; flex-direction: column; gap: 10px;">
        <a href="Rankings.html" style="color: #1877f2; text-decoration: none; font-size: 0.9rem; font-weight: 500;">
          Ver Rankings y Orden de Mérito
        </a>
        
        <!-- Enlace restringido exclusivamente para Jurados -->
        <a href="#" onclick="accederNotasJurado(event)" style="color: #1e3a8a; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
          🔒 Ver Notas por Curso (Exclusivo Jurados)
        </a>
      </div>
    </div>
  </div>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("usuario").value.trim();
      const pass = document.getElementById("contrasena").value;

      const { data, error } = await db
        .from("usuarios")
        .select("id_usuario, nombre, apellido, rol, id_competencia")
        .ilike("email", email)
        .eq("password_hash", pass);

      if (error || !data || data.length === 0) {
        alert("Usuario o contraseña incorrectos.");
        return;
      }

      const validos = data.filter(usr => usr.id_competencia !== null);

      if (validos.length === 0) {
        sessionStorage.setItem("usuario", JSON.stringify(data[0]));
        redireccionar(data[0]);
      } else if (validos.length === 1 || validos[0].rol !== "jurado") {
        sessionStorage.setItem("usuario", JSON.stringify(validos[0]));
        redireccionar(validos[0]);
      } else {
        let mensaje = "Seleccione la competencia a ingresar:\n";
        validos.forEach((usr, index) => {
          mensaje += `${index + 1}. Competencia ID: ${usr.id_competencia}\n`;
        });

        const seleccion = prompt(mensaje);
        const indexElegido = parseInt(seleccion) - 1;

        if (validos[indexElegido]) {
          sessionStorage.setItem("usuario", JSON.stringify(validos[indexElegido]));
          redireccionar(validos[indexElegido]);
        } else {
          alert("Selección inválida.");
        }
      }
    });

    function redireccionar(usuario) {
      if (usuario.rol === "coordinador") {
        location.href = "admin.html";
      } else if (usuario.rol === "jurado") {
        location.href = "jurado.html";
      } else {
        location.href = "alumno.html";
      }
    }

    // Función de protección de acceso para la vista de notas
    function accederNotasJurado(e) {
      e.preventDefault();
      const usuarioGuardado = JSON.parse(sessionStorage.getItem("usuario"));

      if (usuarioGuardado && usuarioGuardado.rol === "jurado") {
        location.href = "notas.html";
      } else {
        alert("Acceso denegado. Debe iniciar sesión con una cuenta de Jurado para ver las notas por curso.");
      }
    }
  </script>
</body>
</html>
