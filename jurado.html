<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Jurado - Evaluación</title>
    <link rel="stylesheet" href="jurado.css"> <!-- O tus estilos correspondientes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="contenedor-principal">
    <header>
        <h2>Panel de Evaluación - Jurado</h2>
        <div id="info-jurado">Cargando datos del jurado...</div>
        <button onclick="irARankings()" style="background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Ver Rankings</button>
        <button onclick="cerrarSesion()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
    </header>

    <main style="margin-top: 20px;">
        <div class="selector-grupo">
            <label for="select-grupo"><strong>Seleccionar Grupo a Evaluar:</strong></label>
            <select id="select-grupo" onchange="cargarDatosEvaluacion()">
                <option value="">-- Seleccione un grupo --</option>
            </select>
        </div>

        <div id="seccion-evaluacion" style="margin-top: 20px; display: none;">
            <h3 id="titulo-grupo-activo">Evaluando equipo</h3>

            <!-- CRITERIOS DE RÚBRICA GRUPAL -->
            <div style="background: rgba(19, 34, 71, 0.9); padding: 15px; border-radius: 8px; color: #fff; margin-bottom: 15px;">
                <h4>Criterios de Evaluación Grupal</h4>
                <div id="lista-criterios">
                    <!-- Se cargan dinámicamente -->
                </div>
            </div>

            <!-- DEFENSA INDIVIDUAL / NIVELES (Especial para 7mo año o alumnos) -->
            <div style="background: rgba(19, 34, 71, 0.9); padding: 15px; border-radius: 8px; color: #fff; margin-bottom: 15px;">
                <h4>Evaluación Individual de Integrantes</h4>
                <div id="lista-integrantes-defensa">
                    <!-- Se cargan los alumnos del grupo para su nota individual -->
                </div>
            </div>

            <!-- COMENTARIOS GENERALES -->
            <div style="margin-bottom: 15px;">
                <label style="color: #fff; display: block; margin-bottom: 5px;">Comentarios Generales:</label>
                <textarea id="comentario-general" rows="3" style="width: 100%; padding: 8px; border-radius: 4px;" placeholder="Escribe observaciones para el grupo..."></textarea>
            </div>

            <!-- BOTONES DE GUARDADO -->
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="guardarEvaluacion('en proceso')" style="background: #f59e0b; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">💾 Guardar Borrador (En Proceso)</button>
                <button onclick="guardarEvaluacion('terminado')" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">✅ Guardar Definitivo (Terminado)</button>
            </div>
        </div>
    </main>
</div>

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
        alert("Acceso denegado. Debe iniciar sesión como Jurado.");
        window.location.href = "index.html";
    }

    document.getElementById('info-jurado').textContent = `Jurado: ${usuarioLogueado.nombre} ${usuarioLogueado.apellido}`;

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    async function inicializarJurado() {
        try {
            const { data: grupos, error } = await db.from('grupos').select('id_grupo, nombre');
            if (error) throw error;

            const select = document.getElementById('select-grupo');
            grupos.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id_grupo;
                opt.textContent = g.nombre;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error("Error al cargar grupos:", err);
        }
    }

    async function cargarDatosEvaluacion() {
        const idGrupo = document.getElementById('select-grupo').value;
        const seccion = document.getElementById('seccion-evaluacion');
        if (!idGrupo) {
            seccion.style.display = 'none';
            return;
        }
        seccion.style.display = 'block';

        // Cargar criterios de rúbrica
        const { data: criterios } = await db.from('criterios_rubrica').select('*');
        const divCriterios = document.getElementById('lista-criterios');
        divCriterios.innerHTML = '';
        if (criterios) {
            criterios.forEach(c => {
                divCriterios.innerHTML += `
                    <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <span>${c.nombre} (Máx: ${c.puntaje_maximo} pts)</span>
                        <input type="number" id="criterio_${c.id_criterio}" min="0" max="${c.puntaje_maximo}" placeholder="Puntaje" style="width: 80px; padding: 4px;">
                    </div>
                `;
            });
        }

        // Cargar integrantes del grupo para defensa individual
        const { data: integrantes } = await db
            .from('grupo_integrantes')
            .select('id_alumno, usuarios(id_usuario, nombre, apellido)')
            .eq('id_grupo', idGrupo);

        const divIntegrantes = document.getElementById('lista-integrantes-defensa');
        divIntegrantes.innerHTML = '';
        if (integrantes) {
            integrantes.forEach(item => {
                const alumno = item.usuarios;
                if (alumno) {
                    divIntegrantes.innerHTML += `
                        <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; margin-bottom: 8px;">
                            <strong>${alumno.nombre} ${alumno.apellido}</strong>
                            <div style="display: flex; gap: 10px; margin-top: 5px;">
                                <input type="number" id="ind_n1_${alumno.id_usuario}" placeholder="Nivel 1 (0-5)" style="width: 100px; padding: 4px;">
                                <input type="number" id="ind_n2_${alumno.id_usuario}" placeholder="Nivel 2 (0-5)" style="width: 100px; padding: 4px;">
                                <input type="number" id="ind_n3_${alumno.id_usuario}" placeholder="Nivel 3 (0-5)" style="width: 100px; padding: 4px;">
                                <input type="number" id="ind_vivo_${alumno.id_usuario}" placeholder="Vivo (0-10)" style="width: 100px; padding: 4px;">
                            </div>
                        </div>
                    `;
                }
            });
        }

        // Verificar si ya existe una evaluación previa de este jurado para este grupo
        const { data: evalExistente } = await db
            .from('evaluaciones')
            .select('*')
            .eq('id_grupo', idGrupo)
            .eq('id_jurado', usuarioLogueado.id_usuario)
            .maybeSingle();

        if (evalExistente) {
            document.getElementById('comentario-general').value = evalExistente.comentario_general || '';
            // Si ya está terminado, podrías bloquear los inputs opcionalmente
        }
    }

    async function guardarEvaluacion(estadoDeseado) {
        const idGrupo = document.getElementById('select-grupo').value;
        const comentario = document.getElementById('comentario-general').value;
        const idJurado = usuarioLogueado.id_usuario;

        if (!idGrupo) {
            alert("Seleccione un grupo primero.");
            return;
        }

        try {
            // 1. Insertar o actualizar la cabecera en 'evaluaciones'
            // Verificamos si ya existe
            const { data: evalActual } = await db
                .from('evaluaciones')
                .select('id_evaluacion')
                .eq('id_grupo', idGrupo)
                .eq('id_jurado', idJurado)
                .maybeSingle();

            let idEvaluacion;

            if (evalActual) {
                idEvaluacion = evalActual.id_evaluacion;
                await db.from('evaluaciones').update({
                    estado: estadoDeseado,
                    comentario_general: comentario
                }).eq('id_evaluacion', idEvaluacion);
            } else {
                const { data: nuevaEval, error: errEval } = await db.from('evaluaciones').insert([{
                    id_grupo: idGrupo,
                    id_jurado: idJurado,
                    estado: estadoDeseado,
                    comentario_general: comentario
                }]).select().single();

                if (errEval) throw errEval;
                idEvaluacion = nuevaEval.id_evaluacion;
            }

            // 2. Guardar detalles de rúbrica (eliminamos anteriores y reinsertamos o actualizamos)
            await db.from('evaluacion_detalle').delete().eq('id_evaluacion', idEvaluacion);

            const inputsCriterios = document.querySelectorAll('#lista-criterios input');
            for (let input of inputsCriterios) {
                const idCriterio = input.id.replace('criterio_', '');
                const puntaje = parseFloat(input.value) || 0;

                await db.from('evaluacion_detalle').insert([{
                    id_evaluacion: idEvaluacion,
                    id_criterio: idCriterio,
                    puntaje: puntaje
                }]);
            }

            // 3. Guardar defensa individual por alumno
            const contenedoresAlumnos = document.querySelectorAll('#lista-integrantes-defensa > div');
            for (let cont of contenedoresAlumnos) {
                // Extraer id del alumno desde los inputs internos
                const inputN1 = cont.querySelector('input[id^="ind_n1_"]');
                if (!inputN1) continue;
                const idAlumno = inputN1.id.replace('ind_n1_', '');

                const n1 = parseFloat(document.getElementById(`ind_n1_${idAlumno}`).value) || 0;
                const n2 = parseFloat(document.getElementById(`ind_n2_${idAlumno}`).value) || 0;
                const n3 = parseFloat(document.getElementById(`ind_n3_${idAlumno}`).value) || 0;
                const vivo = parseFloat(document.getElementById(`ind_vivo_${idAlumno}`).value) || 0;
                const totalInd = n1 + n2 + n3 + vivo;

                // Borramos registro previo de defensa de este alumno para esta evaluación
                await db.from('defensa_individual').delete()
                    .eq('id_evaluacion', idEvaluacion)
                    .eq('id_alumno', idAlumno);

                await db.from('defensa_individual').insert([{
                    id_evaluacion: idEvaluacion,
                    id_alumno: idAlumno,
                    nivel_1: n1,
                    nivel_2: n2,
                    nivel_3: n3,
                    cambio_vivo: vivo,
                    puntaje: totalInd
                }]);
            }

            if (estadoDeseado === 'terminado') {
                alert("¡Evaluación guardada y finalizada con éxito! Ya está disponible en los rankings y para el alumno.");
            } else {
                alert("Borrador guardado correctamente (en proceso). Puedes modificarlo cuando quieras.");
            }

        } catch (error) {
            console.error("Error al guardar la evaluación:", error);
            alert("Ocurrió un error al guardar los datos.");
        }
    }

    window.onload = inicializarJurado;
</script>

</body>
</html>
