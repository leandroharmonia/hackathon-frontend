<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Jurado - Gestión de Hackathon</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Enlace al archivo CSS externo unificado -->
  <link rel="stylesheet" href="css/jurado.css">
</head>
<body>

  <!-- Botón de cerrar sesión flotante superior -->
  <button class="btn-logout-top" onclick="cerrarSesion()">Cerrar Sesión</button>

  <div class="container">
    <div class="header-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <div>
        <h1 class="titulo-admin" style="text-align: left; margin-bottom: 5px;" id="user-greeting">Panel del Jurado</h1>
        <p style="font-size: 0.9rem; color: #475569;">Evaluación de Proyectos por Curso</p>
      </div>
      <div>
        <span style="background: #dbeafe; color: #1e3a8a; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; border: 1px solid #93c5fd;">JURADO</span>
      </div>
    </div>

    <!-- SELECCIÓN DE CURSO A EVALUAR -->
    <div class="form-group" style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #bae6fd; margin-bottom: 20px;">
      <h2 class="section-title" style="margin-top: 0;">1. Seleccionar Curso a Evaluar</h2>
      <div>
        <label for="filtro-curso">Curso / Año:</label>
        <select id="filtro-curso" onchange="cambiarCursoEvaluacion()">
          <option value="">-- Seleccione un curso --</option>
          <option value="1er Año">1er Año</option>
          <option value="2do Año">2do Año</option>
          <option value="3er Año">3er Año</option>
          <option value="4to Año">4to Año</option>
          <option value="5to Año">5to Año</option>
          <option value="6to Año">6to Año</option>
          <option value="7mo Año">7mo Año</option>
        </select>
      </div>
    </div>

    <!-- SECCIÓN DE EVALUACIÓN (Se llena dinámicamente según el curso elegido) -->
    <div id="seccion-evaluacion" style="display: none;">
      <div class="form-group" style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #bae6fd; margin-bottom: 20px;">
        <h2 class="section-title" style="margin-top: 0;">2. Seleccionar Grupo del Curso</h2>
        <div>
          <label for="select-grupo-evaluar">Grupo / Proyecto:</label>
          <select id="select-grupo-evaluar">
            <option value="">-- Seleccione un grupo --</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #bae6fd; margin-bottom: 20px;">
        <h2 class="section-title" style="margin-top: 0;">3. Criterios de Evaluación</h2>
        <div id="contenedor-criterios">
          <p style="color: #64748b;">Seleccione un curso y un grupo para ver los criterios correspondientes.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lunpcumjmkbetdccsmuo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
      alert("Acceso denegado. Debe iniciar sesión como Jurado.");
      window.location.href = "index.html";
    } else {
      document.getElementById("user-greeting").innerText = `Panel de ${usuarioLogueado.nombre} ${usuarioLogueado.apellido}`;
    }

    function cerrarSesion() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    async function cambiarCursoEvaluacion() {
      const cursoSeleccionado = document.getElementById('filtro-curso').value;
      const seccionEval = document.getElementById('seccion-evaluacion');
      const selectGrupo = document.getElementById('select-grupo-evaluar');
      const contenedorCriterios = document.getElementById('contenedor-criterios');

      if (!cursoSeleccionado) {
        seccionEval.style.display = 'none';
        return;
      }

      seccionEval.style.display = 'block';

      // 1. Cargar grupos filtrados por el curso seleccionado
      const { data: grupos, error: errorGrupos } = await _supabase
        .from('grupos')
        .select('*')
        .eq('curso', cursoSeleccionado);

      selectGrupo.innerHTML = '<option value="">-- Seleccione un grupo --</option>';
      if (grupos && grupos.length > 0) {
        grupos.forEach(g => {
          selectGrupo.innerHTML += `<option value="${g.id_grupo}">${g.nombre}</option>`;
        });
      } else {
        selectGrupo.innerHTML = '<option value="">No hay grupos registrados para este curso</option>';
      }

      // 2. Cargar criterios de rúbrica filtrados por el curso seleccionado
      const { data: criterios, error: errorCriterios } = await _supabase
        .from('criterios_rubrica')
        .select('*')
        .eq('curso', cursoSeleccionado)
        .order('orden', { ascending: true });

      contenedorCriterios.innerHTML = '';
      if (criterios && criterios.length > 0) {
        criterios.forEach(c => {
          contenedorCriterios.innerHTML += `
            <div style="margin-bottom: 15px; padding: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
              <label><strong>${c.nombre}</strong> (Máx: ${c.puntaje_maximo} pts)</label>
              <input type="number" class="input-puntaje" data-criterio="${c.id_criterio}" max="${c.puntaje_maximo}" min="0" placeholder="Puntaje obtenido" style="width: 100%; margin-top: 5px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
          `;
        });
      } else {
        contenedorCriterios.innerHTML = '<p style="color: #64748b;">No hay criterios configurados para este curso todavía.</p>';
      }
    }
  </script>
</body>
</html>
