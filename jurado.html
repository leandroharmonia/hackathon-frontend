<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Jurado</title>
    <link rel="stylesheet" href="notas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="texto">
    <div class="titulos">
        <h3>SISTEMA DE EVALUACIÓN</h3>
        <h1>Panel de Evaluación - Jurado</h1>
        <h4 id="info-jurado">Cargando datos del jurado...</h4>
    </div>

    <div style="margin-bottom: 20px;">
        <label for="select-grupo" style="font-weight: bold; color: #333;">Seleccionar Grupo a Evaluar:</label>
        <select id="select-grupo" onchange="cargarDatosEvaluacion()" style="padding: 6px; border-radius: 4px; margin-left: 10px;">
            <option value="">-- Seleccione un grupo --</option>
        </select>
    </div>

    <div id="seccion-evaluacion" style="display: none;">
        <h3>Criterios de Evaluación Grupal</h3>
        <div id="lista-criterios" class="puntajesi" style="margin-bottom: 20px;">
            <!-- Se cargan dinámicamente -->
        </div>

        <h3>Evaluación Individual de Integrantes</h3>
        <div id="lista-integrantes-defensa" class="puntajesg" style="margin-bottom: 20px;">
            <!-- Se cargan dinámicamente -->
        </div>

        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Comentarios Generales:</label>
            <textarea id="comentario-general" rows="3" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;" placeholder="Escribe observaciones para el grupo..."></textarea>
        </div>

        <!-- BOTONES DE GUARDADO -->
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 25px;">
            <button onclick="guardarEvaluacion('en proceso')" style="background: rgba(245, 158, 11, 0.2); color: #d97706; border: 1px solid #f59e0b; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">💾 Guardar Borrador (En Proceso)</button>
            <button onclick="guardarEvaluacion('terminado')" style="background: rgba(16, 185, 129, 0.2); color: #059669; border: 1px solid #10b981; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">✅ Guardar Definitivo (Terminado)</button>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button onclick="irARankings()" style="background: rgba(59,130,246,0.2); color: #2563eb; border: 1px solid #3b82f6; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Ver Rankings</button>
        <button onclick="cerrarSesion()" style="background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #f87171; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cerrar Sesión</button>
    </div>
</div>

<img src="img/Grupos.jpg" alt="Imagen de fondo" class="imagen-fondo">

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
        alert("Acceso denegado. Debe iniciar sesión como Jurado.");
        window.location.href = "index.html";
    }

    document.getElementById('info-jurado').textContent = `Jurado: ${usuarioLogueado.nombre} ${usuarioLogueado.apellido}`;

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    async function inicializarJurado() {
        try {
            const { data: grupos, error } = await db.from('grupos').select('id_grupo, nombre');
            if (error) throw error;

            const select = document.getElementById('select-grupo');
            grupos.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id_grupo;
                opt.textContent = g.nombre;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error("Error al cargar grupos:", err);
        }
    }

    async function cargarDatosEvaluacion() {
        const idGrupo = document.getElementById('select-grupo').value;
        const seccion = document.getElementById('seccion-evaluacion');
        if (!idGrupo) {
            seccion.style.display = 'none';
            return;
        }
        seccion.style.display = 'block';

        // 1. Cargar criterios de rúbrica
        const { data: criterios } = await db.from('criterios_rubrica').select('*');
        const divCriterios = document.getElementById('lista-criterios');
        divCriterios.innerHTML = '';
        if (criterios) {
            criterios.forEach(c => {
                divCriterios.innerHTML += `
                    <div style="background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; color: #fff;">
                        <span>${c.nombre} (Máx: ${c.puntaje_maximo} pts)</span>
                        <input type="number" id="criterio_${c.id_criterio}" min="0" max="${c.puntaje_maximo}" placeholder="Puntaje" style="width: 90px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                    </div>
                `;
            });
        }

        // 2. Cargar integrantes del grupo para defensa individual
        const { data: integrantes } = await db
            .from('grupo_integrantes')
            .select('id_alumno, usuarios(id_usuario, nombre, apellido)')
            .eq('id_grupo', idGrupo);

        const divIntegrantes = document.getElementById('lista-integrantes-defensa');
        divIntegrantes.innerHTML = '';
        if (integrantes) {
            integrantes.forEach(item => {
                const alumno = item.usuarios;
                if (alumno) {
                    divIntegrantes.innerHTML += `
                        <div style="background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 12px; border-radius: 8px; margin-bottom: 10px; color: #fff;">
                            <strong style="color: #60a5fa;">${alumno.nombre} ${alumno.apellido}</strong>
                            <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                <input type="number" id="ind_n1_${alumno.id_usuario}" placeholder="N1 (0-5)" style="width: 90px; padding: 6px; border-radius: 4px;">
                                <input type="number" id="ind_n2_${alumno.id_usuario}" placeholder="N2 (0-5)" style="width: 90px; padding: 6px; border-radius: 4px;">
                                <input type="number" id="ind_n3_${alumno.id_usuario}" placeholder="N3 (0-5)" style="width: 90px; padding: 6px; border-radius: 4px;">
                                <input type="number" id="ind_vivo_${alumno.id_usuario}" placeholder="Vivo (0-10)" style="width: 95px; padding: 6px; border-radius: 4px;">
                            </div>
                        </div>
                    `;
                }
            });
        }

        // 3. Cargar datos si ya existen en la base de datos
        const { data: evalExistente } = await db
            .from('evaluaciones')
            .select('*')
            .eq('id_grupo', idGrupo)
            .eq('id_jurado', usuarioLogueado.id_usuario)
            .maybeSingle();

        if (evalExistente) {
            document.getElementById('comentario-general').value = evalExistente.comentario_general || '';

            // Cargar puntajes de criterios si existen
            const { data: detalles } = await db
                .from('evaluacion_detalle')
                .select('*')
                .eq('id_evaluacion', evalExistente.id_evaluacion);

            if (detalles) {
                detalles.forEach(d => {
                    const input = document.getElementById(`criterio_${d.id_criterio}`);
                    if (input) input.value = d.puntaje;
                });
            }

            // Cargar defensa individual si existe
            const { data: defensas } = await db
                .from('defensa_individual')
                .select('*')
                .eq('id_evaluacion', evalExistente.id_evaluacion);

            if (defensas) {
                defensas.forEach(def => {
                    if(document.getElementById(`ind_n1_${def.id_alumno}`)) document.getElementById(`ind_n1_${def.id_alumno}`).value = def.nivel_1 || '';
                    if(document.getElementById(`ind_n2_${def.id_alumno}`)) document.getElementById(`ind_n2_${def.id_alumno}`).value = def.nivel_2 || '';
                    if(document.getElementById(`ind_n3_${def.id_alumno}`)) document.getElementById(`ind_n3_${def.id_alumno}`).value = def.nivel_3 || '';
                    if(document.getElementById(`ind_vivo_${def.id_alumno}`)) document.getElementById(`ind_vivo_${def.id_alumno}`).value = def.cambio_vivo || '';
                });
            }
        }
    }

    async function guardarEvaluacion(estadoDeseado) {
        const idGrupo = document.getElementById('select-grupo').value;
        const comentario = document.getElementById('comentario-general').value;
        const idJurado = usuarioLogueado.id_usuario;

        if (!idGrupo) {
            alert("Seleccione un grupo primero.");
            return;
        }

        try {
            const { data: evalActual } = await db
                .from('evaluaciones')
                .select('id_evaluacion')
                .eq('id_grupo', idGrupo)
                .eq('id_jurado', idJurado)
                .maybeSingle();

            let idEvaluacion;

            if (evalActual) {
                idEvaluacion = evalActual.id_evaluacion;
                await db.from('evaluaciones').update({
                    estado: estadoDeseado,
                    comentario_general: comentario
                }).eq('id_evaluacion', idEvaluacion);
            } else {
                const { data: nuevaEval, error: errEval } = await db.from('evaluaciones').insert([{
                    id_grupo: idGrupo,
                    id_jurado: idJurado,
                    estado: estadoDeseado,
                    comentario_general: comentario
                }]).select().single();

                if (errEval) throw errEval;
                idEvaluacion = nuevaEval.id_evaluacion;
            }

            await db.from('evaluacion_detalle').delete().eq('id_evaluacion', idEvaluacion);

            const inputsCriterios = document.querySelectorAll('#lista-criterios input');
            for (let input of inputsCriterios) {
                const idCriterio = input.id.replace('criterio_', '');
                const puntaje = parseFloat(input.value) || 0;

                await db.from('evaluacion_detalle').insert([{
                    id_evaluacion: idEvaluacion,
                    id_criterio: idCriterio,
                    puntaje: puntaje
                }]);
            }

            const contenedoresAlumnos = document.querySelectorAll('#lista-integrantes-defensa > div');
            for (let cont of contenedoresAlumnos) {
                const inputN1 = cont.querySelector('input[id^="ind_n1_"]');
                if (!inputN1) continue;
                const idAlumno = inputN1.id.replace('ind_n1_', '');

                const n1 = parseFloat(document.getElementById(`ind_n1_${idAlumno}`).value) || 0;
                const n2 = parseFloat(document.getElementById(`ind_n2_${idAlumno}`).value) || 0;
                const n3 = parseFloat(document.getElementById(`ind_n3_${idAlumno}`).value) || 0;
                const vivo = parseFloat(document.getElementById(`ind_vivo_${idAlumno}`).value) || 0;
                const totalInd = n1 + n2 + n3 + vivo;

                await db.from('defensa_individual').delete()
                    .eq('id_evaluacion', idEvaluacion)
                    .eq('id_alumno', idAlumno);

                await db.from('defensa_individual').insert([{
                    id_evaluacion: idEvaluacion,
                    id_alumno: idAlumno,
                    nivel_1: n1,
                    nivel_2: n2,
                    nivel_3: n3,
                    cambio_vivo: vivo,
                    puntaje: totalInd
                }]);
            }

            if (estadoDeseado === 'terminado') {
                alert("¡Evaluación guardada y finalizada con éxito! Ya está disponible en los rankings y para el alumno.");
            } else {
                alert("Borrador guardado correctamente (en proceso). Puedes modificarlo cuando quieras.");
            }

        } catch (error) {
            console.error("Error al guardar la evaluación:", error);
            alert("Ocurrió un error al guardar los datos.");
        }
    }

    window.onload = inicializarJurado;
</script>

</body>
</html>
