<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Jurado - Evaluación</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: #e0f2fe;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #bae6fd;
        }

        .header-jurado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 15px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .subtitulo-jurado {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            color: #475569;
            font-weight: 500;
        }

        .header-acciones {
            display: flex;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: #000000;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 1px solid #94a3b8;
            color: #0f172a;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: #2563eb;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 8px;
            color: #1e3a8a;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .criterio-card, .integrante-card {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border-left: 5px solid #2563eb;
        }

        .criterio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .criterio-titulo {
            color: #1e3a8a;
            font-size: 1rem;
            font-weight: 700;
        }

        .criterio-max {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        .integrante-nombre {
            color: #1e3a8a;
            display: block;
            margin-bottom: 12px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .grid-niveles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-secundario {
            background-color: #2563eb;
            color: #ffffff;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
        }

        .btn-peligro {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #f87171;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
        }

        .btn-peligro:hover {
            background: #fecaca;
        }

        .btn-borrador {
            background-color: #d97706;
            color: #ffffff;
            flex: 1;
        }

        .btn-cerrar {
            background-color: #16a34a;
            color: #ffffff;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header-jurado">
        <div>
            <h2>Panel de Jurado</h2>
            <p id="info-jurado" class="subtitulo-jurado">Cargando datos del jurado...</p>
        </div>
        <div class="header-acciones">
            <button class="btn-secundario" onclick="irARankings()">Ver Rankings</button>
            <button class="btn-peligro" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <!-- PASO 1: SELECCIONAR CURSO / AÑO -->
    <div class="form-group">
        <label for="select-curso">Curso / Año Destino:</label>
        <select id="select-curso" onchange="seleccionarCurso()">
            <option value="">-- Seleccionar Curso --</option>
        </select>
    </div>

    <!-- PASO 2: SELECCIONAR GRUPO (Oculto hasta que se elija curso) -->
    <div class="form-group" id="grupo-container" style="display: none;">
        <label for="select-grupo">Seleccionar Grupo a Evaluar:</label>
        <select id="select-grupo" onchange="cargarDatosEvaluacion()">
            <option value="">-- Seleccione un grupo --</option>
        </select>
    </div>

    <!-- SECCIÓN DE EVALUACIÓN (Oculta hasta que se elija grupo) -->
    <div id="seccion-evaluacion" style="display: none;">
        <h3 class="section-title" id="titulo-grupo-activo">Evaluando equipo</h3>

        <div class="form-group">
            <label>Criterios de Evaluación Grupal</label>
            <div id="lista-criterios"></div>
        </div>

        <div class="form-group">
            <label>Evaluación Individual de Integrantes (Defensa)</label>
            <div id="lista-integrantes-defensa"></div>
        </div>

        <!-- BOTONES DE GUARDADO -->
        <div class="btn-container">
            <button type="button" class="btn-borrador" onclick="guardarEvaluacion('en proceso')">💾 Guardar Borrador (En Proceso)</button>
            <button type="button" class="btn-cerrar" onclick="guardarEvaluacion('terminado')">✅ Guardar Definitivo (Terminado)</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listaGlobalGrupos = [];

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
        alert("Acceso denegado. Debe iniciar sesión como Jurado.");
        window.location.href = "index.html";
    }

    document.getElementById('info-jurado').textContent = `Jurado: ${usuarioLogueado.nombre} ${usuarioLogueado.apellido}`;

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    async function inicializarJurado() {
        try {
            const { data: cursos, error: errCursos } = await db.from('curso').select('*');
            if (errCursos) throw errCursos;

            const selectCurso = document.getElementById('select-curso');
            selectCurso.innerHTML = '<option value="">-- Seleccionar Curso --</option>';

            if (cursos) {
                cursos.forEach(c => {
                    const nombreCurso = c.nombre || c.curso || `Curso ${c.id_curso}`;
                    const opt = document.createElement('option');
                    opt.value = c.id_curso;
                    opt.textContent = nombreCurso;
                    selectCurso.appendChild(opt);
                });
            }

            const { data: grupos, error: errGrupos } = await db.from('grupos').select('*');
            if (errGrupos) throw errGrupos;

            listaGlobalGrupos = grupos || [];

        } catch (err) {
            console.error("Error al inicializar datos:", err);
        }
    }

    function seleccionarCurso() {
        const idCursoSeleccionado = document.getElementById('select-curso').value;
        const grupoContainer = document.getElementById('grupo-container');
        const selectGrupo = document.getElementById('select-grupo');
        const seccionEvaluacion = document.getElementById('seccion-evaluacion');

        seccionEvaluacion.style.display = 'none';
        selectGrupo.innerHTML = '<option value="">-- Seleccione un grupo --</option>';

        if (!idCursoSeleccionado) {
            grupoContainer.style.display = 'none';
            return;
        }

        const gruposFiltrados = listaGlobalGrupos.filter(g => g.id_curso == idCursoSeleccionado);

        gruposFiltrados.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id_grupo;
            opt.textContent = g.nombre;
            selectGrupo.appendChild(opt);
        });

        grupoContainer.style.display = 'block';
    }

    async function cargarDatosEvaluacion() {
        const idGrupo = document.getElementById('select-grupo').value;
        const seccion = document.getElementById('seccion-evaluacion');
        if (!idGrupo) {
            seccion.style.display = 'none';
            return;
        }
        seccion.style.display = 'block';

        const { data: criterios } = await db.from('criterios_rubrica').select('*');
        const divCriterios = document.getElementById('lista-criterios');
        divCriterios.innerHTML = '';
        if (criterios) {
            criterios.forEach(c => {
                divCriterios.innerHTML += `
                    <div class="criterio-card">
                        <div class="criterio-header">
                            <span class="criterio-titulo">${c.nombre}</span>
                            <span class="criterio-max">Máx: ${c.puntaje_maximo} pts</span>
                        </div>
                        <input type="number" id="criterio_${c.id_criterio}" min="0" max="${c.puntaje_maximo}" placeholder="Puntaje obtenido">
                    </div>
                `;
            });
        }

        const { data: integrantes } = await db
            .from('grupo_integrantes')
            .select('id_alumno, usuarios(id_usuario, nombre, apellido)')
            .eq('id_grupo', idGrupo);

        const divIntegrantes = document.getElementById('lista-integrantes-defensa');
        divIntegrantes.innerHTML = '';
        if (integrantes) {
            integrantes.forEach(item => {
                const alumno = item.usuarios;
                if (alumno) {
                    divIntegrantes.innerHTML += `
                        <div class="integrante-card">
                            <span class="integrante-nombre">${alumno.nombre} ${alumno.apellido}</span>
                            <div class="grid-niveles">
                                <input type="number" id="ind_n1_${alumno.id_usuario}" placeholder="Nivel 1 (0-5)">
                                <input type="number" id="ind_n2_${alumno.id_usuario}" placeholder="Nivel 2 (0-5)">
                                <input type="number" id="ind_n3_${alumno.id_usuario}" placeholder="Nivel 3 (0-5)">
                                <input type="number" id="ind_vivo_${alumno.id_usuario}" placeholder="Vivo (0-10)">
                            </div>
                        </div>
                    `;
                }
            });
        }

        const { data: evalExistente } = await db
            .from('evaluaciones')
            .select('*')
            .eq('id_grupo', idGrupo)
            .eq('id_jurado', usuarioLogueado.id_usuario)
            .maybeSingle();

        if (evalExistente) {
            const { data: detalles } = await db
                .from('evaluacion_detalle')
                .select('id_criterio, puntaje')
                .eq('id_evaluacion', evalExistente.id_evaluacion);

            if (detalles) {
                detalles.forEach(d => {
                    const input = document.getElementById(`criterio_${d.id_criterio}`);
                    if (input) input.value = d.puntaje;
                });
            }

            const { data: defensas } = await db
                .from('defensa_individual')
                .select('*')
                .eq('id_evaluacion', evalExistente.id_evaluacion);

            if (defensas) {
                defensas.forEach(def => {
                    const inpN1 = document.getElementById(`ind_n1_${def.id_alumno}`);
                    const inpN2 = document.getElementById(`ind_n2_${def.id_alumno}`);
                    const inpN3 = document.getElementById(`ind_n3_${def.id_alumno}`);
                    const inpVivo = document.getElementById(`ind_vivo_${def.id_alumno}`);

                    if (inpN1) inpN1.value = def.nivel_1 || 0;
                    if (inpN2) inpN2.value = def.nivel_2 || 0;
                    if (inpN3) inpN3.value = def.nivel_3 || 0;
                    if (inpVivo) inpVivo.value = def.cambio_vivo || 0;
                });
            }
        }
    }

    async function guardarEvaluacion(estadoDeseado) {
        const idGrupo = document.getElementById('select-grupo').value;
        const idJurado = usuarioLogueado.id_usuario;

        if (!idGrupo) {
            alert("Seleccione un grupo primero.");
            return;
        }

        try {
            const { data: evalActual } = await db
                .from('evaluaciones')
                .select('id_evaluacion')
                .eq('id_grupo', idGrupo)
                .eq('id_jurado', idJurado)
                .maybeSingle();

            let idEvaluacion;

            if (evalActual) {
                idEvaluacion = evalActual.id_evaluacion;
                await db.from('evaluaciones').update({
                    estado: estadoDeseado
                }).eq('id_evaluacion', idEvaluacion);
            } else {
                const { data: nuevaEval, error: errEval } = await db.from('evaluaciones').insert([{
                    id_grupo: idGrupo,
                    id_jurado: idJurado,
                    estado: estadoDeseado
                }]).select().single();

                if (errEval) throw errEval;
                idEvaluacion = nuevaEval.id_evaluacion;
            }

            await db.from('evaluacion_detalle').delete().eq('id_evaluacion', idEvaluacion);
            const inputsCriterios = document.querySelectorAll('#lista-criterios input');
            for (let input of inputsCriterios) {
                const idCriterio = input.id.replace('criterio_', '');
                const puntaje = parseFloat(input.value) || 0;

                await db.from('evaluacion_detalle').insert([{
                    id_evaluacion: idEvaluacion,
                    id_criterio: idCriterio,
                    puntaje: puntaje
                }]);
            }

            const contenedoresAlumnos = document.querySelectorAll('#lista-integrantes-defensa > div');
            for (let cont of contenedoresAlumnos) {
                const inputN1 = cont.querySelector('input[id^="ind_n1_"]');
                if (!inputN1) continue;
                const idAlumno = inputN1.id.replace('ind_n1_', '');

                const n1 = parseFloat(document.getElementById(`ind_n1_${idAlumno}`).value) || 0;
                const n2 = parseFloat(document.getElementById(`ind_n2_${idAlumno}`).value) || 0;
                const n3 = parseFloat(document.getElementById(`ind_n3_${idAlumno}`).value) || 0;
                const vivo = parseFloat(document.getElementById(`ind_vivo_${idAlumno}`).value) || 0;
                const totalInd = n1 + n2 + n3 + vivo;

                await db.from('defensa_individual').delete()
                    .eq('id_evaluacion', idEvaluacion)
                    .eq('id_alumno', idAlumno);

                await db.from('defensa_individual').insert([{
                    id_evaluacion: idEvaluacion,
                    id_alumno: idAlumno,
                    nivel_1: n1,
                    nivel_2: n2,
                    nivel_3: n3,
                    cambio_vivo: vivo,
                    puntaje: totalInd
                }]);
            }

            if (estadoDeseado === 'terminado') {
                alert("¡Evaluación guardada y finalizada con éxito! Ya está disponible en los rankings y para el alumno.");
            } else {
                alert("Borrador guardado correctamente (en proceso). Puedes modificarlo cuando quieras.");
            }

        } catch (error) {
            console.error("Error al guardar la evaluación:", error);
            alert("Ocurrió un error al guardar los datos.");
        }
    }

    window.onload = inicializarJurado;
</script>

</body>
</html>
