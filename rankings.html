<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Mérito - Rankings</title>
    <link rel="stylesheet" href="rankings.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        background-color: #f0f4f8;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(30, 64, 175, 0.05) 0%, transparent 40%),
          url('img/Grupos.jpg');
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 30px 20px;
        min-height: 100vh;
      }

      .contenedor-principal {
        max-width: 900px;
        margin: auto;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        border: 1px solid #bae6fd;
        color: #0f172a;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid #bae6fd;
        padding-bottom: 15px;
      }

      h2 {
        color: #1e3a8a;
        margin: 0;
        font-weight: 800;
      }

      .btn-volver {
        background: #2563eb;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
        transition: background 0.2s;
      }

      .btn-volver:hover {
        background: #1d4ed8;
      }

      .selector-curso-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #e0f2fe;
        padding: 14px 20px;
        border-radius: 12px;
        margin-bottom: 15px;
        border: 1px solid #bae6fd;
      }

      .selector-curso-container label {
        font-weight: 700;
        color: #1e3a8a;
      }

      .selector-curso-container select {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #94a3b8;
        background-color: #ffffff;
        color: #0f172a;
        font-weight: 600;
        outline: none;
        cursor: pointer;
      }

      .tabla-wrapper {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background-color: #f1f5f9;
        color: #1e3a8a;
        padding: 14px;
        font-weight: 700;
        border-bottom: 2px solid #cbd5e1;
      }

      td {
        padding: 12px 14px;
        border-bottom: 1px solid #e2e8f0;
        color: #1e293b;
      }

      tr:nth-child(even) {
        background-color: #f8fafc;
      }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <header>
        <div>
            <h2 id="titulo-ranking">Orden de Mérito / Rankings</h2>
            <p id="subtitulo-competencia" style="margin: 5px 0 0 0; font-size: 0.9rem; color: #475569; font-weight: 600;"></p>
        </div>
        <button class="btn-volver" onclick="volverAlPanel()">← Volver al Panel</button>
    </header>

    <!-- Selector de Competencia -->
    <div class="selector-curso-container">
        <label for="select-competencia">Seleccionar Competencia:</label>
        <select id="select-competencia" onchange="cambiarCompetencia()">
            <option value="">-- Cargando competencias --</option>
        </select>
    </div>

    <!-- Selector de Filtro por Año / Curso -->
    <div class="selector-curso-container">
        <label for="select-filtro-curso">Filtrar por Año / Curso:</label>
        <select id="select-filtro-curso" onchange="renderizarTablaRanking()">
            <option value="todos">Todos los Cursos</option>
            <option value="7">7mo Año</option>
            <option value="6">6to Año</option>
            <option value="5">5to Año</option>
            <option value="4">4to Año</option>
            <option value="3">3er Año</option>
            <option value="2">2do Año</option>
            <option value="1">1er Año</option>
        </select>
    </div>

    <div class="tabla-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">Posición</th>
                    <th style="width: 50%;">Equipo</th>
                    <th style="width: 15%;">Curso</th>
                    <th style="width: 20%; text-align: right;">Puntaje Promedio</th>
                </tr>
            </thead>
            <tbody id="tabla-ranking">
                <tr><td colspan="4" style="padding: 20px; text-align: center; color: #64748b;">Cargando rankings...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let idCompetenciaActiva = null;
    let rankingCache = [];
    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "null");

    function volverAlPanel() {
        if (!usuarioLogueado) {
            window.location.href = "index.html";
            return;
        }
        if (usuarioLogueado.rol === "coordinador") {
            window.location.href = "admin.html";
        } else if (usuarioLogueado.rol === "jurado") {
            window.location.href = "jurado.html";
        } else {
            window.location.href = "alumno.html";
        }
    }

    async function inicializarRankings() {
        await cargarListaCompetencias();
    }

    async function cargarListaCompetencias() {
        try {
            const { data: comps, error } = await db.from('competencias').select('*').order('id_competencia', { ascending: false });
            const select = document.getElementById('select-competencia');
            select.innerHTML = '';
            
            if (comps && comps.length > 0) {
                comps.forEach(c => {
                    select.innerHTML += `<option value="${c.id_competencia}">${c.nombre}</option>`;
                });

                // Selecciona por defecto la primera de la lista si no hay otra activa
                if (!idCompetenciaActiva) {
                    idCompetenciaActiva = comps[0].id_competencia;
                }
                
                select.value = idCompetenciaActiva;
                await cambiarCompetencia();
            } else {
                select.innerHTML = '<option value="">No hay competencias disponibles</option>';
            }
        } catch (err) {
            console.error("Error al cargar competencias:", err);
        }
    }

    async function cambiarCompetencia() {
        const select = document.getElementById('select-competencia');
        idCompetenciaActiva = select.value;
        
        if (!idCompetenciaActiva) {
            document.getElementById('tabla-ranking').innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #64748b;">Seleccione una competencia válida.</td></tr>';
            document.getElementById('subtitulo-competencia').textContent = '';
            rankingCache = [];
            return;
        }

        await cargarNombreCompetencia(idCompetenciaActiva);
        await cargarRankings(idCompetenciaActiva);
    }

    async function cargarNombreCompetencia(idComp) {
        const { data } = await db.from('competencias').select('nombre').eq('id_competencia', idComp).maybeSingle();
        if (data) {
            document.getElementById('subtitulo-competencia').textContent = `Competencia: ${data.nombre}`;
        }
    }

    async function cargarRankings(idComp) {
        const tbody = document.getElementById('tabla-ranking');
        tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #64748b;">Calculando rankings...</td></tr>';

        try {
            const { data: grupos, error: errGrupos } = await db
                .from('grupos')
                .select('id_grupo, nombre, id_curso')
                .eq('id_competencia', parseInt(idComp));

            if (errGrupos) throw errGrupos;

            if (!grupos || grupos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #64748b;">No hay equipos registrados en esta competencia todavía.</td></tr>';
                rankingCache = [];
                return;
            }

            let rankingData = [];

            for (let grupo of grupos) {
                const { data: evs } = await db
                    .from('evaluaciones')
                    .select('id_evaluacion')
                    .eq('id_grupo', grupo.id_grupo)
                    .in('estado', ['terminado', 'cerrado']);

                let sumaPuntajesGrupo = 0;
                let cantidadJurados = evs ? evs.length : 0;

                if (cantidadJurados > 0) {
                    for (let ev of evs) {
                        const { data: detalles } = await db
                            .from('evaluacion_detalle')
                            .select('puntaje')
                            .eq('id_evaluacion', ev.id_evaluacion);

                        if (detalles) {
                            detalles.forEach(d => {
                                sumaPuntajesGrupo += (parseFloat(d.puntaje) || 0);
                            });
                        }
                    }
                }

                let promedioGrupo = cantidadJurados > 0 ? (sumaPuntajesGrupo / cantidadJurados) : 0;

                rankingData.push({
                    nombre: grupo.nombre,
                    curso: grupo.id_curso || '-',
                    puntaje: promedioGrupo
                });
            }

            rankingData.sort((a, b) => b.puntaje - a.puntaje);
            rankingCache = rankingData;

            renderizarTablaRanking();

        } catch (error) {
            console.error("Error al calcular rankings:", error);
            tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #dc2626;">Error al cargar el orden de mérito.</td></tr>';
        }
    }

    function renderizarTablaRanking() {
        const cursoFiltro = document.getElementById('select-filtro-curso').value;
        const tbody = document.getElementById('tabla-ranking');

        let filtrados = rankingCache.filter(item => {
            if (cursoFiltro === 'todos') return true;
            return String(item.curso) === cursoFiltro;
        });

        tbody.innerHTML = '';
        if (filtrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #64748b;">No hay equipos registrados para este curso.</td></tr>';
            return;
        }

        filtrados.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: 700; color: #2563eb;">#${index + 1}</td>
                    <td style="font-weight: 600;">${item.nombre}</td>
                    <td>${item.curso}° Año</td>
                    <td style="text-align: right; font-weight: 700; color: #16a34a;">${item.puntaje.toFixed(1)} pts</td>
                </tr>
            `;
        });
    }

    window.onload = inicializarRankings;
</script>

</body>
</html>
