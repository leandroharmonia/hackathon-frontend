<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Mérito - Rankings</title>
    <link rel="stylesheet" href="rankings.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="contenedor-principal" style="padding: 20px; color: #fff; max-width: 800px; margin: auto;">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
            <h2 id="titulo-ranking" style="margin: 0;">Orden de Mérito / Rankings</h2>
            <p id="subtitulo-competencia" style="margin: 5px 0 0 0; font-size: 0.9rem; color: #93c5fd;"></p>
        </div>
        <button onclick="volverAlPanel()" style="background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Volver al Panel</button>
    </header>

    <!-- Selector opcional por si ingresa directo sin sesión -->
    <div id="selector-competencia-container" style="display: none; background: rgba(19, 34, 71, 0.9); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <label for="select-competencia-externa" style="display: block; margin-bottom: 8px; font-weight: bold;">Seleccione la Competencia a Visualizar:</label>
        <select id="select-competencia-externa" onchange="cambiarCompetenciaExterna()" style="width: 100%; padding: 10px; border-radius: 6px; background: #f1f5f9; color: #0f172a; border: 1px solid #94a3b8;">
            <option value="">-- Seleccione una competencia --</option>
        </select>
    </div>

    <div style="background: rgba(19, 34, 71, 0.9); padding: 20px; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 2px solid #3b82f6;">
                    <th style="padding: 8px;">Posición</th>
                    <th style="padding: 8px;">Equipo</th>
                    <th style="padding: 8px; text-align: right;">Puntaje Total (Terminado)</th>
                </tr>
            </thead>
            <tbody id="tabla-ranking">
                <tr><td colspan="3" style="padding: 10px; text-align: center;">Cargando rankings...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let idCompetenciaActiva = null;
    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "null");

    function volverAlPanel() {
        if (!usuarioLogueado) {
            window.location.href = "index.html";
            return;
        }
        if (usuarioLogueado.rol === "coordinador") {
            window.location.href = "admin.html";
        } else if (usuarioLogueado.rol === "jurado") {
            window.location.href = "jurado.html";
        } else {
            window.location.href = "alumno.html";
        }
    }

    async function inicializarRankings() {
        if (usuarioLogueado && usuarioLogueado.id_competencia) {
            idCompetenciaActiva = usuarioLogueado.id_competencia;
            cargarNombreCompetencia(idCompetenciaActiva);
            cargarRankings(idCompetenciaActiva);
        } else {
            document.getElementById('selector-competencia-container').style.display = 'block';
            await cargarListaCompetenciasExterna();
        }
    }

    async function cargarListaCompetenciasExterna() {
        const { data: comps } = await db.from('competencias').select('*').order('id_competencia', { ascending: false });
        const select = document.getElementById('select-competencia-externa');
        select.innerHTML = '<option value="">-- Seleccione una competencia --</option>';
        if (comps) {
            comps.forEach(c => {
                select.innerHTML += `<option value="${c.id_competencia}">${c.nombre}</option>`;
            });
        }
    }

    function cambiarCompetenciaExterna() {
        const select = document.getElementById('select-competencia-externa');
        idCompetenciaActiva = select.value;
        if (idCompetenciaActiva) {
            cargarNombreCompetencia(idCompetenciaActiva);
            cargarRankings(idCompetenciaActiva);
        } else {
            document.getElementById('tabla-ranking').innerHTML = '<tr><td colspan="3" style="padding: 10px; text-align: center;">Seleccione una competencia para ver el ranking.</td></tr>';
            document.getElementById('subtitulo-competencia').textContent = '';
        }
    }

    async function cargarNombreCompetencia(idComp) {
        const { data } = await db.from('competencias').select('nombre').eq('id_competencia', idComp).maybeSingle();
        if (data) {
            document.getElementById('subtitulo-competencia').textContent = `Competencia: ${data.nombre}`;
        }
    }

    async function cargarRankings(idComp) {
        const tbody = document.getElementById('tabla-ranking');
        tbody.innerHTML = '<tr><td colspan="3" style="padding: 10px; text-align: center;">Calculando rankings...</td></tr>';

        try {
            const { data: grupos, error: errGrupos } = await db
                .from('grupos')
                .select('id_grupo, nombre')
                .eq('id_competencia', parseInt(idComp));

            if (errGrupos) throw errGrupos;

            if (!grupos || grupos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="padding: 10px; text-align: center;">No hay equipos registrados en esta competencia.</td></tr>';
                return;
            }

            let rankingData = [];

            for (let grupo of grupos) {
                const { data: evs } = await db
                    .from('evaluaciones')
                    .select('id_evaluacion')
                    .eq('id_grupo', grupo.id_grupo)
                    .in('estado', ['terminado', 'cerrado']);

                let puntajeTotalGrupo = 0;

                if (evs && evs.length > 0) {
                    for (let ev of evs) {
                        const { data: detalles } = await db
                            .from('evaluacion_detalle')
                            .select('puntaje')
                            .eq('id_evaluacion', ev.id_evaluacion);

                        if (detalles) {
                            detalles.forEach(d => {
                                puntajeTotalGrupo += (d.puntaje || 0);
                            });
                        }
                    }
                }

                rankingData.push({
                    nombre: grupo.nombre,
                    puntaje: puntajeTotalGrupo
                });
            }

            rankingData.sort((a, b) => b.puntaje - a.puntaje);

            tbody.innerHTML = '';
            if (rankingData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="padding: 10px; text-align: center;">No hay equipos evaluados de forma definitiva todavía en esta competencia.</td></tr>';
                return;
            }

            rankingData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                        <td style="padding: 10px; font-weight: bold; color: #60a5fa;">#${index + 1}</td>
                        <td style="padding: 10px;">${item.nombre}</td>
                        <td style="padding: 10px; text-align: right; font-weight: bold; color: #34d399;">${item.puntaje} pts</td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error("Error al calcular rankings:", error);
            tbody.innerHTML = '<tr><td colspan="3" style="padding: 10px; text-align: center; color: #f87171;">Error al cargar el orden de mérito.</td></tr>';
        }
    }

    window.onload = inicializarRankings;
</script>

</body>
</html>
