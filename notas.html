<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Cargadas por Curso - Hackathon 2026</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Librería html2pdf para forzar el nombre exacto del archivo descargado -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #1877f2;
      --secondary-color: #1e3a8a;
      --bg-surface: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --border-color: #bae6fd;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f4f8;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(30, 64, 175, 0.05) 0%, transparent 40%),
        url('img/Grupos.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-main);
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container-notas {
      max-width: 1100px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--border-color);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-volver {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-print {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(24, 119, 242, 0.3);
      transition: all 0.2s ease;
    }

    .btn-print:hover {
      background-color: var(--secondary-color);
      transform: translateY(-1px);
    }

    .header-notas {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .header-notas h1 {
      margin: 0;
      color: var(--secondary-color);
      font-size: 2rem;
      font-weight: 800;
    }

    .header-notas p {
      margin: 6px 0 0 0;
      color: #475569;
    }

    .selector-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #e0f2fe;
      padding: 16px 22px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .selector-container label {
      font-weight: 700;
      color: var(--secondary-color);
      font-size: 1rem;
    }

    .selector-container select {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      font-size: 0.95rem;
      background-color: #ffffff;
      outline: none;
      cursor: pointer;
      color: var(--text-main);
    }

    .table-responsive {
      overflow-x: auto;
    }

    .tabla-notas {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: center;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .tabla-notas th, .tabla-notas td {
      border: 1px solid #cbd5e1;
      padding: 12px 14px;
    }

    .tabla-notas th {
      background-color: #f1f5f9;
      color: var(--secondary-color);
      font-weight: 700;
    }

    .tabla-notas th span {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: normal;
    }

    .tabla-notas tr:nth-child(even) {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

<div class="container-notas" id="area-impresion">
  <div class="toolbar">
    <a href="jurado.html" class="btn-volver">← Volver al Panel de Jurado</a>
    <button onclick="exportarPDF()" class="btn-print" id="btn-pdf">🖨️ Descargar PDF con Nombre Personalizado</button>
  </div>

  <div class="header-notas">
    <h1>Notas Cargadas por Año y Curso</h1>
    <p id="subtitulo-competencia">Consulte las calificaciones y puntajes registrados en la base de datos</p>
  </div>

  <!-- Selector de Competencia -->
  <div class="selector-container" id="contenedor-select-competencia">
    <label for="select-competencia">Seleccionar Competencia:</label>
    <select id="select-competencia" onchange="cambiarCompetencia()">
      <option value="">-- Cargando competencias --</option>
    </select>
  </div>

  <!-- Selector de Curso -->
  <div class="selector-container">
    <label for="select-curso">Seleccionar Año / Curso:</label>
    <select id="select-curso" onchange="filtrarNotas()">
      <option value="todos">Todos los Cursos</option>
      <option value="7">7mo Año</option>
      <option value="6">6to Año</option>
      <option value="5">5to Año</option>
      <option value="4">4to Año</option>
      <option value="3">3ro Año</option>
      <option value="2">2do Año</option>
      <option value="1">1ro Año</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="tabla-notas">
      <thead>
        <tr>
          <th>Puesto</th>
          <th style="text-align: left;">Grupo</th>
          <th>Curso</th>
          <th>Criterio 1</th>
          <th>Criterio 2</th>
          <th>Criterio 3</th>
          <th>Criterio 4</th>
          <th>Criterio 5</th>
          <th>Total <span>(de 100)</span></th>
        </tr>
      </thead>
      <tbody id="tabla-notas-body">
        <tr>
          <td colspan="9">Cargando datos desde Supabase...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "{}");
  if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
    alert("Acceso denegado: solo el personal de jurados puede acceder a esta sección.");
    window.location.href = "index.html";
  }

  const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let notasCache = [];
  let idCompetenciaActiva = usuarioLogueado.id_competencia || null;
  let nombreCompetenciaActiva = "";

  async function inicializarNotas() {
    await cargarListaCompetencias();
  }

  async function cargarListaCompetencias() {
    try {
      const { data: comps, error } = await db.from('competencias').select('*').order('id_competencia', { ascending: false });
      const select = document.getElementById('select-competencia');
      select.innerHTML = '';
      
      if (comps && comps.length > 0) {
        comps.forEach(c => {
          select.innerHTML += `<option value="${c.id_competencia}">${c.nombre}</option>`;
        });

        if (!idCompetenciaActiva || !comps.some(c => c.id_competencia == idCompetenciaActiva)) {
          idCompetenciaActiva = comps[0].id_competencia;
        }
        
        select.value = idCompetenciaActiva;
        await cambiarCompetencia();
      } else {
        select.innerHTML = '<option value="">No hay competencias disponibles</option>';
      }
    } catch (err) {
      console.error("Error al cargar competencias:", err);
    }
  }

  async function cambiarCompetencia() {
    const select = document.getElementById('select-competencia');
    idCompetenciaActiva = select.value;
    
    if (!idCompetenciaActiva) {
      document.getElementById('tabla-notas-body').innerHTML = `<tr><td colspan="9">Seleccione una competencia válida.</td></tr>`;
      document.getElementById('subtitulo-competencia').textContent = '';
      notasCache = [];
      return;
    }

    const optionSelected = select.options[select.selectedIndex];
    nombreCompetenciaActiva = optionSelected ? optionSelected.text.trim() : "Competencia";

    document.getElementById('subtitulo-competencia').textContent = `Competencia: ${nombreCompetenciaActiva} — Calificaciones y puntajes registrados`;

    await cargarNotas(idCompetenciaActiva);
  }

  async function cargarNotas(idComp) {
    const tbody = document.getElementById('tabla-notas-body');
    tbody.innerHTML = `<tr><td colspan="9">Cargando datos desde Supabase...</td></tr>`;

    try {
      const { data: gruposComp, error: errGruposComp } = await db
        .from('grupos')
        .select('id_grupo, nombre, id_curso')
        .eq('id_competencia', parseInt(idComp));

      if (errGruposComp) throw errGruposComp;

      if (!gruposComp || gruposComp.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No hay grupos registrados en esta competencia.</td></tr>`;
        notasCache = [];
        return;
      }

      const idsGrupos = gruposComp.map(g => g.id_grupo);
      const gruposMap = {};
      gruposComp.forEach(g => {
        gruposMap[g.id_grupo] = {
          id_grupo: g.id_grupo,
          nombre_grupo: g.nombre,
          curso: g.id_curso || '-',
          juradosCount: 0,
          criterios: [0, 0, 0, 0, 0],
          total: 0
        };
      });

      const { data: evalData, error: evalErr } = await db
        .from('evaluaciones')
        .select('id_evaluacion, id_grupo, estado')
        .in('id_grupo', idsGrupos)
        .eq('estado', 'cerrado');

      if (evalErr) throw evalErr;

      if (!evalData || evalData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No hay notas cerradas registradas para esta competencia todavía.</td></tr>`;
        notasCache = [];
        return;
      }

      for (let e of evalData) {
        const idG = e.id_grupo;
        if (!gruposMap[idG]) continue;

        gruposMap[idG].juradosCount += 1;

        const { data: detalles } = await db
          .from('evaluacion_detalle')
          .select('puntaje')
          .eq('id_evaluacion', e.id_evaluacion);

        let totalEvaluacion = 0;
        if (detalles) {
          detalles.forEach((d, idx) => {
            const pts = parseFloat(d.puntaje) || 0;
            totalEvaluacion += pts;
            if (idx < 5) {
              gruposMap[idG].criterios[idx] += pts;
            }
          });
        }
        gruposMap[idG].total += totalEvaluacion;
      }

      notasCache = Object.values(gruposMap).filter(g => g.juradosCount > 0).map(g => {
        const cant = g.juradosCount || 1;
        return {
          id_grupo: g.id_grupo,
          nombre_grupo: g.nombre_grupo,
          curso: g.curso,
          crit1: g.criterios[0] / cant,
          crit2: g.criterios[1] / cant,
          crit3: g.criterios[2] / cant,
          crit4: g.criterios[3] / cant,
          crit5: g.criterios[4] / cant,
          total: g.total / cant
        };
      });

      filtrarNotas();
    } catch (err) {
      console.error('Error al cargar notas:', err);
      tbody.innerHTML = `<tr><td colspan="9" style="color:red;">Error al consultar las calificaciones en la base de datos</td></tr>`;
    }
  }

  function filtrarNotas() {
    const cursoSeleccionado = document.getElementById('select-curso').value;
    
    let filtrados = notasCache.filter(item => {
      if (cursoSeleccionado === 'todos') return true;
      const c = String(item.curso || '');
      return c === cursoSeleccionado;
    });

    filtrados.sort((a, b) => {
      const totA = parseFloat(a.total || 0);
      const totB = parseFloat(b.total || 0);
      return totB - totA;
    });

    const tbody = document.getElementById('tabla-notas-body');
    tbody.innerHTML = '';

    if (filtrados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9">No hay notas registradas para este curso o filtro.</td></tr>`;
      return;
    }

    filtrados.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight: 700;">${index + 1}°</td>
        <td style="text-align: left; font-weight: 600;">${item.nombre_grupo}</td>
        <td>${item.curso}° Año</td>
        <td>${(parseFloat(item.crit1) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit2) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit3) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit4) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit5) || 0).toFixed(1)}</td>
        <td><strong>${(parseFloat(item.total) || 0).toFixed(1)}</strong></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportarPDF() {
    const anioActual = new Date().getFullYear();
    const cursoSeleccionado = document.getElementById('select-curso').value;
    const nombreCursoTexto = cursoSeleccionado === 'todos' ? 'Todos los Cursos' : `${cursoSeleccionado}° Año`;
    const nombreComp = nombreCompetenciaActiva ? nombreCompetenciaActiva : "Competencia";
    
    // Nombre exacto y limpio para el archivo PDF descargado
    const nombreArchivo = `Notas Cargadas ${nombreCursoTexto} - ${nombreComp} (${anioActual}).pdf`;

    const elemento = document.getElementById('area-impresion');
    const botonOriginal = document.querySelector('.toolbar');
    
    // Ocultar temporalmente los botones durante la generación del PDF
    botonOriginal.style.display = 'none';

    const opciones = {
      margin:       10,
      filename:     nombreArchivo,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    html2pdf().from(elemento).set(opciones).save().then(() => {
      botonOriginal.style.display = 'flex';
    });
  }

  window.onload = inicializarNotas;
</script>

</body>
</html>
