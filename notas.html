<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Cargadas por Curso - Hackathon 2026</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #1877f2;
      --secondary-color: #1e3a8a;
      --bg-surface: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --border-color: #bae6fd;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Fondo dinámico utilizando la imagen img/Grupos.jpg */
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)), url('img/Grupos.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container-notas {
      max-width: 1100px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-volver {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Botón Imprimir adaptado a la paleta azul */
    .btn-print {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(24, 119, 242, 0.3);
      transition: all 0.2s ease;
    }

    .btn-print:hover {
      background-color: var(--secondary-color);
      transform: translateY(-1px);
    }

    .header-notas {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .header-notas h1 {
      margin: 0;
      color: var(--secondary-color);
      font-size: 2rem;
      font-weight: 800;
    }

    .header-notas p {
      margin: 6px 0 0 0;
      color: #475569;
    }

    .selector-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #e0f2fe;
      padding: 16px 22px;
      border-radius: 12px;
      margin-bottom: 22px;
      border: 1px solid var(--border-color);
    }

    .selector-container label {
      font-weight: 700;
      color: var(--secondary-color);
      font-size: 1rem;
    }

    .selector-container select {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      font-size: 0.95rem;
      background-color: #ffffff;
      outline: none;
      cursor: pointer;
      color: var(--text-main);
    }

    .table-responsive {
      overflow-x: auto;
    }

    .tabla-notas {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: center;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .tabla-notas th, .tabla-notas td {
      border: 1px solid #cbd5e1;
      padding: 12px 14px;
    }

    .tabla-notas th {
      background-color: #f1f5f9;
      color: var(--secondary-color);
      font-weight: 700;
    }

    .tabla-notas th span {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: normal;
    }

    .tabla-notas tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* REGLAS PARA IMPRESIÓN Y EXPORTACIÓN A PDF */
    @media print {
      body {
        background: #ffffff !important;
        padding: 0;
        color: #000000;
      }

      .container-notas {
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
        background-color: #ffffff;
      }

      .toolbar, .selector-container {
        display: none !important;
      }

      .header-notas {
        border-bottom: 2px solid #000;
      }

      .header-notas h1 {
        color: #000;
        font-size: 1.6rem;
      }

      .tabla-notas th {
        background-color: #e2e8f0 !important;
        color: #000 !important;
      }

      .tabla-notas th, .tabla-notas td {
        border: 1px solid #64748b !important;
        padding: 6px 8px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="container-notas">
  <div class="toolbar">
    <a href="jurado.html" class="btn-volver">← Volver al Panel de Jurado</a>
    <button onclick="window.print()" class="btn-print">🖨️ Imprimir / Exportar a PDF</button>
  </div>

  <div class="header-notas">
    <h1>Notas Cargadas por Año y Curso</h1>
    <p>Consulte las calificaciones y puntajes registrados en la base de datos</p>
  </div>

  <div class="selector-container">
    <label for="select-curso">Seleccionar Año / Curso:</label>
    <select id="select-curso" onchange="filtrarNotas()">
      <option value="todos">Todos los Cursos</option>
      <option value="7">7mo Año</option>
      <option value="6">6to Año</option>
      <option value="5">5to Año</option>
      <option value="4">4to Año</option>
      <option value="3">3ro Año</option>
      <option value="2">2do Año</option>
      <option value="1">1ro Año</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="tabla-notas">
      <thead>
        <tr>
          <th>Puesto</th>
          <th style="text-align: left;">Grupo</th>
          <th>Curso</th>
          <th>Producto <span>(de 25)</span></th>
          <th>Stand y Pitch <span>(de 15)</span></th>
          <th>Base de Datos <span>(de 20)</span></th>
          <th>Defensa <span>(de 25)</span></th>
          <th>Carpeta y Reg. <span>(de 15)</span></th>
          <th>Total <span>(de 100)</span></th>
        </tr>
      </thead>
      <tbody id="tabla-notas-body">
        <tr>
          <td colspan="9">Cargando datos desde Supabase...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Verificación de autenticación de jurado
  const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "{}");
  if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
    alert("Acceso denegado: solo el personal de jurados puede acceder a esta sección.");
    window.location.href = "index.html";
  }

  const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let notasCache = [];

  async function cargarNotas() {
    try {
      // 1. Intentar consulta primaria sobre la vista de rankings
      let { data, error } = await db.from('vista_ranking_grupos').select('*');

      // 2. Si la vista no devuelve datos o falla, consultar la relación de evaluaciones directa
      if (error || !data || data.length === 0) {
        const { data: evalData, error: evalErr } = await db
          .from('evaluaciones')
          .select(`
            id_evaluacion,
            id_grupo,
            grupos ( id_grupo, nombre, id_curso ),
            evaluacion_detalle ( id_criterio, puntaje )
          `);
        
        if (!evalErr && evalData) {
          data = evalData.map(e => {
            const detalles = e.evaluacion_detalle || [];
            const total = detalles.reduce((acc, curr) => acc + (parseFloat(curr.puntaje) || 0), 0);
            return {
              id_grupo: e.id_grupo,
              nombre_grupo: e.grupos ? e.grupos.nombre : `Grupo ${e.id_grupo}`,
              curso: e.grupos ? e.grupos.id_curso : '-',
              producto: detalles[0] ? detalles[0].puntaje : 0,
              stand_pitch: detalles[1] ? detalles[1].puntaje : 0,
              base_datos: detalles[2] ? detalles[2].puntaje : 0,
              defensa: detalles[3] ? detalles[3].puntaje : 0,
              carpeta_registro: detalles[4] ? detalles[4].puntaje : 0,
              total: total
            };
          });
        }
      }

      notasCache = data || [];
      filtrarNotas();
    } catch (err) {
      console.error('Error al cargar datos:', err);
      document.getElementById('tabla-notas-body').innerHTML = 
        `<tr><td colspan="9" style="color:red;">Error al consultar las calificaciones en la base de datos</td></tr>`;
    }
  }

  function filtrarNotas() {
    const cursoSeleccionado = document.getElementById('select-curso').value;
    
    let filtrados = notasCache.filter(item => {
      if (cursoSeleccionado === 'todos') return true;
      const c = String(item.curso || item.anio || item.id_curso || '');
      return c.includes(cursoSeleccionado);
    });

    filtrados.sort((a, b) => {
      const totA = parseFloat(a.total || a.puntaje_total || 0);
      const totB = parseFloat(b.total || b.puntaje_total || 0);
      if (totB !== totA) return totB - totA;
      const defA = parseFloat(a.defensa || 0);
      const defB = parseFloat(b.defensa || 0);
      return defB - defA;
    });

    const tbody = document.getElementById('tabla-notas-body');
    tbody.innerHTML = '';

    if (filtrados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9">No hay notas registradas para este curso.</td></tr>`;
      return;
    }

    filtrados.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight: 700;">${index + 1}°</td>
        <td style="text-align: left; font-weight: 600;">${item.nombre_grupo || item.grupo || 'Grupo ' + (item.id_grupo || '')}</td>
        <td>${item.curso || item.anio || '-'}° Año</td>
        <td>${(parseFloat(item.producto) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.stand_pitch) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.base_datos) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.defensa) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.carpeta_registro) || 0).toFixed(1)}</td>
        <td><strong>${(parseFloat(item.total || item.puntaje_total) || 0).toFixed(1)}</strong></td>
      `;
      tbody.appendChild(tr);
    });
  }

  cargarNotas();
</script>

</body>
</html>
