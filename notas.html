<script>
  const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "{}");
  if (!usuarioLogueado || usuarioLogueado.rol !== "jurado") {
    alert("Acceso denegado: solo el personal de jurados puede acceder a esta sección.");
    window.location.href = "index.html";
  }

  const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let notasCache = [];
  let idCompetenciaActiva = usuarioLogueado.id_competencia || null;
  let nombreCompetenciaActiva = "";

  async function inicializarNotas() {
    await cargarListaCompetencias();
  }

  async function cargarListaCompetencias() {
    const { data: comps, error } = await db.from('competencias').select('*').order('id_competencia', { ascending: false });
    const select = document.getElementById('select-competencia');
    select.innerHTML = '';
    
    if (comps && comps.length > 0) {
      comps.forEach(c => {
        select.innerHTML += `<option value="${c.id_competencia}">${c.nombre}</option>`;
      });

      // Si el usuario logueado tiene una competencia válida, la seleccionamos; si no, la primera de la lista
      if (!idCompetenciaActiva || !comps.some(c => c.id_competencia == idCompetenciaActiva)) {
        idCompetenciaActiva = comps[0].id_competencia;
      }
      
      select.value = idCompetenciaActiva;
      await cambiarCompetencia();
    } else {
      select.innerHTML = '<option value="">No hay competencias disponibles</option>';
    }
  }

  async function cambiarCompetencia() {
    const select = document.getElementById('select-competencia');
    idCompetenciaActiva = select.value;
    
    if (!idCompetenciaActiva) {
      document.getElementById('tabla-notas-body').innerHTML = `<tr><td colspan="9">Seleccione una competencia válida.</td></tr>`;
      document.getElementById('subtitulo-competencia').textContent = '';
      notasCache = [];
      return;
    }

    // Obtener el nombre exacto de la opción seleccionada en el select de forma inmediata
    const optionSelected = select.options[select.selectedIndex];
    nombreCompetenciaActiva = optionSelected ? optionSelected.text : "Competencia";

    document.getElementById('subtitulo-competencia').textContent = `Competencia: ${nombreCompetenciaActiva} — Calificaciones y puntajes registrados`;

    // Cargar los datos de los grupos y notas correspondientes a esta competencia
    await cargarNotas(idCompetenciaActiva);
  }

  async function cargarNotas(idComp) {
    const tbody = document.getElementById('tabla-notas-body');
    tbody.innerHTML = `<tr><td colspan="9">Cargando datos desde Supabase...</td></tr>`;

    try {
      // 1. Buscar grupos vinculados a esta competencia
      const { data: gruposComp, error: errGruposComp } = await db
        .from('grupos')
        .select('id_grupo, nombre, id_curso')
        .eq('id_competencia', parseInt(idComp));

      if (errGruposComp) throw errGruposComp;

      if (!gruposComp || gruposComp.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No hay grupos registrados en esta competencia.</td></tr>`;
        notasCache = [];
        return;
      }

      const idsGrupos = gruposComp.map(g => g.id_grupo);
      const gruposMap = {};
      gruposComp.forEach(g => {
        gruposMap[g.id_grupo] = {
          id_grupo: g.id_grupo,
          nombre_grupo: g.nombre,
          curso: g.id_curso || '-',
          juradosCount: 0,
          criterios: [0, 0, 0, 0, 0],
          total: 0
        };
      });

      // 2. Buscar evaluaciones cerradas para estos grupos
      const { data: evalData, error: evalErr } = await db
        .from('evaluaciones')
        .select('id_evaluacion, id_grupo, estado')
        .in('id_grupo', idsGrupos)
        .eq('estado', 'cerrado');

      if (evalErr) throw evalErr;

      if (!evalData || evalData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No hay notas cerradas registradas para esta competencia todavía.</td></tr>`;
        notasCache = [];
        return;
      }

      for (let e of evalData) {
        const idG = e.id_grupo;
        if (!gruposMap[idG]) continue;

        gruposMap[idG].juradosCount += 1;

        const { data: detalles } = await db
          .from('evaluacion_detalle')
          .select('puntaje')
          .eq('id_evaluacion', e.id_evaluacion);

        let totalEvaluacion = 0;
        if (detalles) {
          detalles.forEach((d, idx) => {
            const pts = parseFloat(d.puntaje) || 0;
            totalEvaluacion += pts;
            if (idx < 5) {
              gruposMap[idG].criterios[idx] += pts;
            }
          });
        }
        gruposMap[idG].total += totalEvaluacion;
      }

      notasCache = Object.values(gruposMap).filter(g => g.juradosCount > 0).map(g => {
        const cant = g.juradosCount || 1;
        return {
          id_grupo: g.id_grupo,
          nombre_grupo: g.nombre_grupo,
          curso: g.curso,
          crit1: g.criterios[0] / cant,
          crit2: g.criterios[1] / cant,
          crit3: g.criterios[2] / cant,
          crit4: g.criterios[3] / cant,
          crit5: g.criterios[4] / cant,
          total: g.total / cant
        };
      });

      filtrarNotas();
    } catch (err) {
      console.error('Error al cargar notas:', err);
      tbody.innerHTML = `<tr><td colspan="9" style="color:red;">Error al consultar las calificaciones en la base de datos</td></tr>`;
    }
  }

  function filtrarNotas() {
    const cursoSeleccionado = document.getElementById('select-curso').value;
    
    let filtrados = notasCache.filter(item => {
      if (cursoSeleccionado === 'todos') return true;
      const c = String(item.curso || '');
      return c === cursoSeleccionado;
    });

    filtrados.sort((a, b) => {
      const totA = parseFloat(a.total || 0);
      const totB = parseFloat(b.total || 0);
      return totB - totA;
    });

    const tbody = document.getElementById('tabla-notas-body');
    tbody.innerHTML = '';

    if (filtrados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9">No hay notas registradas para este curso o filtro.</td></tr>`;
      return;
    }

    filtrados.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight: 700;">${index + 1}°</td>
        <td style="text-align: left; font-weight: 600;">${item.nombre_grupo}</td>
        <td>${item.curso}° Año</td>
        <td>${(parseFloat(item.crit1) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit2) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit3) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit4) || 0).toFixed(1)}</td>
        <td>${(parseFloat(item.crit5) || 0).toFixed(1)}</td>
        <td><strong>${(parseFloat(item.total) || 0).toFixed(1)}</strong></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportarPDF() {
    const anioActual = new Date().getFullYear();
    const nombreComp = nombreCompetenciaActiva ? nombreCompetenciaActiva.trim() : "Competencia";
    
    const tituloOriginal = document.title;
    // Esto asegura que el nombre del PDF sea exactamente: Notas Cargadas [Año]-[Nombre de la Competencia]
    document.title = `Notas Cargadas ${anioActual}-${nombreComp}`;
    
    window.print();

    setTimeout(() => {
      document.title = tituloOriginal;
    }, 1000);
  }

  window.onload = inicializarNotas;
</script>
