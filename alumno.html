<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación del Alumno</title>
    <link rel="stylesheet" href="css/notas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Ajustes adicionales para garantizar correspondencia visual con la interfaz */
        .card-evaluacion {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .tag-estado {
            font-size: 0.78rem;
            background: #dcfce7;
            color: #15803d;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .total-puntos {
            margin-top: 10px;
            text-align: right;
            font-weight: 800;
            color: #2563eb;
            font-size: 1.05rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="texto">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
        <div class="titulos" style="margin-bottom: 0;">
            <h3>SISTEMA DE EVALUACIÓN</h3>
            <h1>Evaluación personal y grupal</h1>
            <h4 id="nombre-grupo">Actividad: Cargando equipo...</h4>
        </div>
        <!-- Botón para ver ranking directo del alumno -->
        <button onclick="irARankings()" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.15);">Ver Rankings</button>
    </div>

    <h3 style="color: #1e3a8a; margin-top: 20px;">Puntaje individual</h3>
    <div id="puntaje-individual" class="puntajesi">
        <p style="color: #64748b;">Cargando tu calificación individual...</p>
    </div>

    <h3 style="color: #1e3a8a; margin-top: 20px;">Puntaje grupal</h3>
    <div id="puntaje-grupal" class="puntajesg">
        <p style="color: #64748b;">Buscando calificaciones grupales de los jurados...</p>
    </div>

    <!-- SECCIÓN DE PROMEDIO FINAL -->
    <h3 style="color: #1e3a8a; margin-top: 25px;">Resumen y Promedio Final</h3>
    <div id="promedio-final">
        <p style="color: #64748b;">Calculando resultado final...</p>
    </div>

    <div style="margin-top: 25px;">
        <button onclick="cerrarSesion()" style="background: #fee2e2; color: #dc2626; border: 1px solid #f87171; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">Cerrar Sesión</button>
    </div>
</div>

<img src="img/Grupos.jpg" alt="Imagen de fondo" class="imagen-fondo">

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3OiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "alumno") {
        alert("Acceso denegado. Debe iniciar sesión como Alumno.");
        window.location.href = "index.html";
    }

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    async function cargarDatosAlumno() {
        const divIndividual = document.getElementById('puntaje-individual');
        const divGrupal = document.getElementById('puntaje-grupal');
        const divPromedio = document.getElementById('promedio-final');
        const h4Grupo = document.getElementById('nombre-grupo');

        let totalPuntajeIndividual = 0;
        let listaTotalesGrupales = [];

        try {
            const { data: relGrupo, error: errRel } = await db
                .from('grupo_integrantes')
                .select('id_grupo, grupos(nombre, id_competencia)')
                .eq('id_alumno', usuarioLogueado.id_usuario)
                .maybeSingle();

            if (errRel || !relGrupo) {
                h4Grupo.textContent = "Actividad: Sin grupo asignado";
                divIndividual.innerHTML = '<p style="color: #dc2626;">No estás asignado a ningún grupo todavía.</p>';
                divGrupal.innerHTML = '<p style="color: #dc2626;">Sin calificaciones disponibles.</p>';
                divPromedio.innerHTML = '<p style="color: #dc2626;">Sin datos para promediar.</p>';
                return;
            }

            const idGrupo = relGrupo.id_grupo;
            const nombreGrupo = relGrupo.grupos ? relGrupo.grupos.nombre : 'Equipo';
            
            if (relGrupo.grupos && relGrupo.grupos.id_competencia) {
                usuarioLogueado.id_competencia = relGrupo.grupos.id_competencia;
                sessionStorage.setItem("usuario", JSON.stringify(usuarioLogueado));
            }

            h4Grupo.textContent = `Actividad: Evaluaciones para el equipo "${nombreGrupo}"`;

            // 1. OBTENER PUNTAJE INDIVIDUAL
            const { data: notaInd } = await db
                .from('defensa_individual')
                .select('*')
                .eq('id_alumno', usuarioLogueado.id_usuario)
                .maybeSingle();

            if (!notaInd) {
                divIndividual.innerHTML = `
                    <div class="card-evaluacion">
                        <strong style="color: #1e3a8a;">${usuarioLogueado.nombre} ${usuarioLogueado.apellido} (Tú)</strong>
                        <p style="margin: 6px 0 0 0; color: #64748b; font-size: 0.9rem;">Aún no tienes calificaciones individuales registradas.</p>
                    </div>
                `;
            } else {
                let detallePuntaje = '';
                totalPuntajeIndividual = notaInd.total || notaInd.puntaje || notaInd.nota || 0;

                if (notaInd.nivel_1 !== undefined || notaInd.n1 !== undefined) {
                    const n1 = notaInd.nivel_1 || notaInd.n1 || 0;
                    const n2 = notaInd.nivel_2 || notaInd.n2 || 0;
                    const n3 = notaInd.nivel_3 || notaInd.n3 || 0;
                    const vivo = notaInd.cambio_vivo || notaInd.vivo || 0;
                    detallePuntaje = `
                        <div>• Nivel 1: <strong>${n1}</strong> / 5 pts</div>
                        <div>• Nivel 2: <strong>${n2}</strong> / 5 pts</div>
                        <div>• Nivel 3: <strong>${n3}</strong> / 5 pts</div>
                        <div>• Cambio en vivo / Pizarra: <strong>${vivo}</strong> / 10 pts</div>
                    `;
                }

                divIndividual.innerHTML = `
                    <div class="card-evaluacion">
                        <strong style="color: #1e3a8a;">${usuarioLogueado.nombre} ${usuarioLogueado.apellido} (Tú)</strong>
                        <div style="margin-top: 8px; font-size: 0.9rem; color: #334155;">
                            ${detallePuntaje}
                        </div>
                        <div class="total-puntos">
                            Total Individual: ${totalPuntajeIndividual} pts
                        </div>
                    </div>
                `;
            }

            // 2. OBTENER EVALUACIONES GRUPALES
            const { data: evaluaciones, error: errEval } = await db
                .from('evaluaciones')
                .select('id_evaluacion, estado')
                .eq('id_grupo', idGrupo);

            if (errEval) throw errEval;

            if (!evaluaciones || evaluaciones.length === 0) {
                divGrupal.innerHTML = '<p style="color: #64748b;">Tu equipo aún no ha recibido calificaciones grupales de los jurados.</p>';
            } else {
                divGrupal.innerHTML = '';
                for (let ev of evaluaciones) {
                    const { data: detalles } = await db
                        .from('evaluacion_detalle')
                        .select('puntaje, criterios_rubrica(nombre, puntaje_maximo)')
                        .eq('id_evaluacion', ev.id_evaluacion);

                    let htmlCriterios = '';
                    let sumaTotalGrupal = 0;
                    if (detalles) {
                        detalles.forEach(d => {
                            if (d.criterios_rubrica) {
                                sumaTotalGrupal += d.puntaje;
                                htmlCriterios += `<div style="margin: 4px 0;">• ${d.criterios_rubrica.nombre}: <strong>${d.puntaje}</strong> / ${d.criterios_rubrica.puntaje_maximo} pts</div>`;
                            }
                        });
                    }

                    listaTotalesGrupales.push(sumaTotalGrupal);

                    divGrupal.innerHTML += `
                        <div class="card-evaluacion">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <strong style="color: #1e3a8a;">Evaluación de Jurado</strong>
                                <span class="tag-estado">${ev.estado || 'cerrado'}</span>
                            </div>
                            <div style="font-size: 0.9rem; color: #334155;">${htmlCriterios || 'No hay criterios evaluados todavía.'}</div>
                            <div class="total-puntos">
                                Total Grupal: ${sumaTotalGrupal} pts
                            </div>
                        </div>
                    `;
                }
            }

            // 3. CALCULAR Y MOSTRAR PROMEDIO FINAL
            let promedioGrupal = 0;
            if (listaTotalesGrupales.length > 0) {
                const sumaGrupales = listaTotalesGrupales.reduce((acc, curr) => acc + curr, 0);
                promedioGrupal = sumaGrupales / listaTotalesGrupales.length;
            }

            const puntajeFinalTotal = (promedioGrupal + totalPuntajeIndividual).toFixed(2);

            divPromedio.innerHTML = `
                <div class="card-evaluacion" style="background: #f0f9ff; border: 2px solid #3b82f6;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 0.95rem; color: #1e293b; margin-bottom: 12px;">
                        <div>• Promedio Grupal (${listaTotalesGrupales.length} jurados): <strong style="color: #1e3a8a;">${promedioGrupal.toFixed(2)} pts</strong></div>
                        <div>• Puntaje Individual: <strong style="color: #1e3a8a;">${totalPuntajeIndividual} pts</strong></div>
                    </div>
                    <div style="text-align: right; border-top: 2px dashed #93c5fd; padding-top: 10px;">
                        <span style="font-size: 1.1rem; color: #1e3a8a; font-weight: 700;">Promedio Final Total: </span>
                        <span style="font-size: 1.5rem; color: #2563eb; font-weight: 800;">${puntajeFinalTotal} pts</span>
                    </div>
                </div>
            `;

        } catch (error) {
            console.error("Error al cargar calificaciones del alumno:", error);
            divGrupal.innerHTML = '<p style="color: #dc2626;">Ocurrió un error al cargar las notas.</p>';
            divPromedio.innerHTML = '<p style="color: #dc2626;">No se pudo calcular el promedio final.</p>';
        }
    }

    window.onload = cargarDatosAlumno;
</script>

</body>
</html>
