<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Evaluación - Alumno</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      /* Recuperamos la ilustración/siluetas de fondo de la interfaz original */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(30, 64, 175, 0.05) 0%, transparent 40%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* Contenedor principal idéntico al diseño original */
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid #e2e8f0;
      position: relative;
      z-index: 10;
    }

    .header-box {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .main-title {
      font-size: 1.35rem;
      color: #1e3a8a;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .filter-group {
      margin-bottom: 12px;
    }

    .filter-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }

    .select-competencia {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
      color: #1e293b;
      font-size: 0.88rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-competencia:focus {
      border-color: #2563eb;
    }

    .info-alumno {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 6px;
    }

    .info-alumno strong {
      color: #1e293b;
    }

    .section-title {
      font-size: 0.95rem;
      color: #1e3a8a;
      font-weight: 700;
      margin: 18px 0 10px 0;
    }

    /* Cajas contenedoras idénticas a la referencia */
    .content-box {
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 16px;
      background-color: #ffffff;
      margin-bottom: 15px;
    }

    .empty-state {
      color: #dc2626;
      font-size: 0.88rem;
      text-align: center;
      padding: 8px;
    }

    .eval-card {
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .eval-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #1e293b;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    .badge-score {
      background-color: #dbeafe;
      color: #1e40af;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .comentario-text {
      font-size: 0.82rem;
      color: #64748b;
      font-style: italic;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-top: 4px;
    }

    .criterios-ul {
      list-style: none;
      margin: 8px 0;
      padding-left: 0;
    }

    .criterio-li {
      display: flex;
      justify-content: space-between;
      font-size: 0.81rem;
      color: #475569;
      padding: 2px 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .summary-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e3a8a;
    }

    .summary-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #16a34a;
    }

    .btn-logout {
      margin-top: 20px;
      background-color: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background-color: #fecaca;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Encabezado con selector de Competencia y datos del usuario -->
    <div class="header-box">
      <div class="subtitle">SISTEMA DE EVALUACIÓN</div>
      <div class="main-title">Evaluación personal y grupal</div>

      <!-- Selector de Competencia previo a mostrar los datos -->
      <div class="filter-group">
        <label for="selectCompetencia">Seleccionar Competencia:</label>
        <select id="selectCompetencia" class="select-competencia" onchange="cambiarCompetencia()">
          <option value="1">Olimpiadas de Informática Escolar - Hackathon 2026</option>
          <!-- Aquí puedes poblar más competencias desde tu BD si existieran -->
        </select>
      </div>

      <div class="info-alumno"><strong>Alumno:</strong> <span id="lblNombreAlumno">Cargando...</span></div>
      <div class="info-alumno"><strong>Grupo Asignado:</strong> <span id="lblGrupoAlumno">Cargando...</span></div>
    </div>

    <!-- Puntaje Individual -->
    <div class="section-title">Puntaje individual</div>
    <div class="content-box" id="boxIndividual">
      <div class="empty-state">Cargando puntajes individuales...</div>
    </div>

    <!-- Puntaje Grupal -->
    <div class="section-title">Puntaje grupal</div>
    <div class="content-box" id="boxGrupal">
      <div class="empty-state">Cargando calificaciones grupales...</div>
    </div>

    <!-- Resumen y Promedio Final -->
    <div class="section-title">Resumen y Promedio Final</div>
    <div class="summary-card">
      <span class="summary-title">Promedio Grupal Final:</span>
      <span class="summary-value" id="lblPromedioFinal">-- / 100</span>
    </div>

    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <script>
    // FUNCIÓN PARA CONECTAR A TU BASE DE DATOS REAL (Backend API)
    async function cargarDatosDesdeBD() {
      const idCompetenciaSeleccionada = document.getElementById('selectCompetencia').value;
      
      // NOTA PARA TI: Aquí harás la llamada a tu servidor backend (Node.js/PHP) conectado a PostgreSQL.
      // Ejemplo: const response = await fetch(`/api/alumno/evaluaciones?competencia=${idCompetenciaSeleccionada}`);
      // const data = await response.json();

      // --- SIMULACIÓN DE DATOS DINÁMICOS SEGÚN EL USUARIO LOGUEADO (Ej: Lara Palacios) ---
      // Cuando lo conectes a tu BD, estos valores vendrán de la tabla 'usuarios', 'grupos', 'defensa_individual' y 'evaluaciones'.
      const dataBackendReal = {
        nombreAlumno: "Lara Palacios", // Dinámico según la sesión iniciada
        nombreGrupo: "Grupo 1 - SIGEM",
        defensas: [
          { jurado: "Jurado Evaluador 1", puntaje: 14.0, comentario: "Buena defensa y manejo del rol asignado." }
        ],
        grupales: [
          {
            jurado: "Jurado Evaluador 1",
            criterios: [
              { nombre: "Arquitectura y Modelo de Datos", puntaje: 23.0, max: 25 },
              { nombre: "Interfaz y Experiencia de Usuario", puntaje: 14.0, max: 15 },
              { nombre: "Funcionalidad Backend y Lógica", puntaje: 19.0, max: 20 },
              { nombre: "Seguridad, Roles y Cierre", puntaje: 24.0, max: 25 },
              { nombre: "Exposición Oral y Pitch", puntaje: 14.0, max: 15 }
            ],
            comentarioGeneral: "Excelente trabajo en la integración del SIGEM."
          }
        ]
      };

      // 1. Pintar Nombre y Grupo real
      document.getElementById('lblNombreAlumno').innerText = dataBackendReal.nombreAlumno;
      document.getElementById('lblGrupoAlumno').innerText = dataBackendReal.nombreGrupo;

      // 2. Pintar Puntaje Individual
      const boxIndiv = document.getElementById('boxIndividual');
      boxIndiv.innerHTML = '';
      if (!dataBackendReal.defensas || dataBackendReal.defensas.length === 0) {
        boxIndiv.innerHTML = `<div class="empty-state">No estás asignado a ningún grupo todavía o no hay notas individuales.</div>`;
      } else {
        dataBackendReal.defensas.forEach(d => {
          boxIndiv.innerHTML += `
            <div class="eval-card">
              <div class="eval-header">
                <span>Evaluador: ${d.jurado}</span>
                <span class="badge-score">${d.puntaje} pts</span>
              </div>
              <div class="comentario-text">"${d.comentario}"</div>
            </div>
          `;
        });
      }

      // 3. Pintar Puntaje Grupal y Calcular Promedio exclusivo grupal
      const boxGrup = document.getElementById('boxGrupal');
      boxGrup.innerHTML = '';
      
      let sumaTotalGrupal = 0;
      let totalEvaluadoresGrupales = dataBackendReal.grupales.length;

      if (totalEvaluadoresGrupales === 0) {
        boxGrup.innerHTML = `<div class="empty-state">Sin calificaciones grupales disponibles.</div>`;
        document.getElementById('lblPromedioFinal').innerText = "Sin datos";
      } else {
        dataBackendReal.grupales.forEach(ev => {
          // Suma de los criterios de la rúbrica para este jurado
          const subtotalEvaluacion = ev.criterios.reduce((acc, c) => acc + c.puntaje, 0);
          sumaTotalGrupal += subtotalEvaluacion;

          let listaCriteriosHtml = ev.criterios.map(c => `
            <li class="criterio-li">
              <span>${c.nombre}</span>
              <strong>${c.puntaje} / ${c.max}</strong>
            </li>
          `).join('');

          boxGrup.innerHTML += `
            <div class="eval-card">
              <div class="eval-header">
                <span>Jurado: ${ev.jurado}</span>
                <span class="badge-score">Total Jurado: ${subtotalEvaluacion.toFixed(2)} pts</span>
              </div>
              <ul class="criterios-ul">
                ${listaCriteriosHtml}
              </ul>
              <div class="comentario-text"><strong>Comentario:</strong> "${ev.comentarioGeneral}"</div>
            </div>
          `;
        });

        // Promedio exclusivo grupal (promediando las notas cerradas de los jurados)
        const promedioFinalGrupal = sumaTotalGrupal / totalEvaluadoresGrupales;
        document.getElementById('lblPromedioFinal').innerText = `${promedioFinalGrupal.toFixed(2)} / 100`;
      }
    }

    function cambiarCompetencia() {
      // Al cambiar la competencia en el selector, recarga los datos correspondientes
      cargarDatosDesdeBD();
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', cargarDatosDesdeBD);

    function cerrarSesion() {
      alert('Sesión cerrada correctamente.');
      // window.location.href = 'login.html';
    }
  </script>
</body>
</html>
