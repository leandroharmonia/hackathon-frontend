<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación del Alumno</title>
    <link rel="stylesheet" href="css/notas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="texto">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
        <div class="titulos" style="margin-bottom: 0;">
            <h3>SISTEMA DE EVALUACIÓN</h3>
            <h1>Evaluación personal y grupal</h1>
            <!-- Nombre del alumno logueado -->
            <h4 id="nombre-alumno" style="color: #60a5fa; margin-top: 4px; font-size: 0.95rem;">Alumno: Cargando...</h4>
            <!-- Grupo asignado -->
            <h4 id="nombre-grupo" style="color: #94a3b8; margin-top: 2px; font-size: 0.85rem;">Actividad: Cargando equipo...</h4>
        </div>
        <!-- Botón para ver ranking -->
        <button onclick="irARankings()" style="background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">Ver Ranking</button>
    </div>

    <!-- FILTRO DE COMPETENCIAS DIRECTO DE LA TABLA 'competencias' -->
    <div style="margin-bottom: 15px; background: rgba(19, 34, 71, 0.7); padding: 10px; border-radius: 8px; border: 1px solid #1e3a75;">
        <label for="selectCompetencia" style="display: block; font-size: 0.8rem; font-weight: bold; color: #60a5fa; margin-bottom: 4px;">Filtrar Competencia:</label>
        <select id="selectCompetencia" onchange="cargarDatosAlumno()" style="width: 100%; padding: 7px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; font-size: 0.85rem;">
            <option value="">Cargando competencias...</option>
        </select>
    </div>

    <h3>Puntaje individual</h3>
    <div id="puntaje-individual" class="puntajesi">
        <p>Cargando tu calificación individual...</p>
    </div>

    <h3>Puntaje grupal</h3>
    <div id="puntaje-grupal" class="puntajesg">
        <p>Buscando calificaciones grupales de los jurados...</p>
    </div>

    <!-- APARTADO DE PROMEDIO GENERAL GRUPAL -->
    <div style="margin-top: 15px; background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; color: #fff;">
        <span style="font-weight: bold; font-size: 0.9rem; color: #60a5fa;">Promedio General Grupal:</span>
        <span id="promedio-grupal-final" style="font-size: 1.1rem; font-weight: bold; color: #34d399;">-- / 100</span>
    </div>

    <div style="margin-top: 25px;">
        <button onclick="cerrarSesion()" style="background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #f87171; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">Cerrar Sesión</button>
    </div>
</div>

<img src="img/Grupos.jpg" alt="Imagen de fondo" class="imagen-fondo">

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogueado || usuarioLogueado.rol !== "alumno") {
        alert("Acceso denegado. Debe iniciar sesión como Alumno.");
        window.location.href = "index.html";
    }

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    // Cargar las competencias reales desde la tabla 'competencias'
    async function cargarFiltroCompetencias() {
        const select = document.getElementById('selectCompetencia');
        try {
            const { data: competencias, error } = await db
                .from('competencias')
                .select('id_competencia, nombre')
                .order('id_competencia', { ascending: false });

            if (error) throw error;

            if (competencias && competencias.length > 0) {
                select.innerHTML = '';
                competencias.forEach(comp => {
                    const option = document.createElement('option');
                    option.value = comp.id_competencia;
                    option.textContent = comp.nombre;
                    select.appendChild(option);
                });
            } else {
                select.innerHTML = '<option value="">No hay competencias</option>';
            }
        } catch (err) {
            console.error("Error al cargar competencias:", err);
            select.innerHTML = '<option value="">Error al cargar</option>';
        }
    }

    async function cargarDatosAlumno() {
        // Mostrar nombre del alumno logueado de inmediato
        document.getElementById('nombre-alumno').textContent = `Alumno: ${usuarioLogueado.nombre} ${usuarioLogueado.apellido}`;

        const divIndividual = document.getElementById('puntaje-individual');
        const divGrupal = document.getElementById('puntaje-grupal');
        const h4Grupo = document.getElementById('nombre-grupo');
        const lblPromedioFinal = document.getElementById('promedio-grupal-final');
        const idCompetenciaFiltro = document.getElementById('selectCompetencia').value;

        if (!idCompetenciaFiltro) {
            h4Grupo.textContent = "Actividad: Seleccione una competencia";
            divIndividual.innerHTML = '<p style="color: #94a3b8;">Seleccione una competencia para ver su calificación.</p>';
            divGrupal.innerHTML = '<p style="color: #94a3b8;">Seleccione una competencia para ver las calificaciones.</p>';
            lblPromedioFinal.textContent = "-- / 100";
            return;
        }

        try {
            // Buscar los grupos del alumno
            const { data: relIntegrantes, error: errRel } = await db
                .from('grupo_integrantes')
                .select('id_grupo, grupos(id_grupo, nombre, id_competencia)')
                .eq('id_alumno', usuarioLogueado.id_usuario);

            if (errRel || !relIntegrantes || relIntegrantes.length === 0) {
                h4Grupo.textContent = "Actividad: Sin grupo asignado";
                divIndividual.innerHTML = '<p style="color: #f87171;">No estás asignado a ningún grupo todavía.</p>';
                divGrupal.innerHTML = '<p style="color: #f87171;">Sin calificaciones disponibles.</p>';
                lblPromedioFinal.textContent = "0.00 / 100";
                return;
            }

            // Filtrar estrictamente el grupo que pertenezca a la competencia seleccionada actual
            let grupoValido = relIntegrantes.find(r => r.grupos && String(r.grupos.id_competencia) === String(idCompetenciaFiltro));

            if (!grupoValido) {
                h4Grupo.textContent = "Actividad: Sin grupo en esta competencia";
                divIndividual.innerHTML = '<p style="color: #94a3b8;">No estás participando en esta competencia específica.</p>';
                divGrupal.innerHTML = '<p style="color: #94a3b8;">Sin calificaciones para esta competencia.</p>';
                lblPromedioFinal.textContent = "-- / 100";
                return;
            }

            const idGrupo = grupoValido.id_grupo;
            const nombreGrupo = grupoValido.grupos ? grupoValido.grupos.nombre : 'Equipo';

            h4Grupo.textContent = `Actividad: Evaluaciones para el equipo "${nombreGrupo}"`;

            // Cargar puntaje individual (Defensa Individual) vinculado a esta competencia o grupo
            const { data: notaInd } = await db
                .from('defensa_individual')
                .select('*')
                .eq('id_alumno', usuarioLogueado.id_usuario)
                .maybeSingle();

            if (!notaInd) {
                divIndividual.innerHTML = `
                    <div style="background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 12px; border-radius: 8px; color: #fff;">
                        <strong style="color: #60a5fa;">${usuarioLogueado.nombre} ${usuarioLogueado.apellido} (Tú)</strong>
                        <p style="margin: 6px 0 0 0; color: #94a3b8; font-size: 0.9rem;">Aún no tienes calificaciones individuales registradas.</p>
                    </div>
                `;
            } else {
                let totalInd = notaInd.puntaje || 0;
                divIndividual.innerHTML = `
                    <div style="background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 12px; border-radius: 8px; color: #fff;">
                        <strong style="color: #60a5fa;">${usuarioLogueado.nombre} ${usuarioLogueado.apellido} (Tú)</strong>
                        <div style="margin-top: 6px; font-size: 0.9rem; color: #cbd5e1;">Comentario: ${notaInd.comentario || 'Sin observaciones'}</div>
                        <div style="margin-top: 8px; text-align: right; font-weight: bold; color: #38bdf8; font-size: 1rem; border-top: 1px solid #1e3a75; padding-top: 6px;">
                            Total Individual: ${totalInd} pts
                        </div>
                    </div>
                `;
            }

            // Cargar Evaluaciones Grupales exclusivamente para este grupo de la competencia seleccionada
            const { data: evaluaciones, error: errEval } = await db
                .from('evaluaciones')
                .select('id_evaluacion, estado, comentario_general, id_jurado')
                .eq('id_grupo', idGrupo);

            if (errEval) throw errEval;

            if (!evaluaciones || evaluaciones.length === 0) {
                divGrupal.innerHTML = '<p style="color: #94a3b8;">Tu equipo aún no ha recibido calificaciones grupales de los jurados en esta competencia.</p>';
                lblPromedioFinal.textContent = "0.00 / 100";
            } else {
                divGrupal.innerHTML = '';
                let sumaTotalGeneralGrupales = 0;
                let cantidadJuradosCerrados = 0;

                for (let ev of evaluaciones) {
                    let nombreJurado = "Evaluación de Jurado";
                    if (ev.id_jurado) {
                        const { data: juradoData } = await db
                            .from('usuarios')
                            .select('nombre, apellido')
                            .eq('id_usuario', ev.id_jurado)
                            .maybeSingle();
                        if (juradoData) {
                            nombreJurado = `Jurado: ${juradoData.nombre} ${juradoData.apellido}`;
                        }
                    }

                    const { data: detalles } = await db
                        .from('evaluacion_detalle')
                        .select('puntaje, criterios_rubrica(nombre, puntaje_maximo)')
                        .eq('id_evaluacion', ev.id_evaluacion);

                    let htmlCriterios = '';
                    let sumaTotalGrupal = 0;
                    if (detalles) {
                        detalles.forEach(d => {
                            if (d.criterios_rubrica) {
                                sumaTotalGrupal += Number(d.puntaje);
                                htmlCriterios += `<div style="margin: 4px 0;">• ${d.criterios_rubrica.nombre}: <strong>${d.puntaje}</strong> / ${d.criterios_rubrica.puntaje_maximo} pts</div>`;
                            }
                        });
                    }

                    if (ev.estado === 'cerrado') {
                        sumaTotalGeneralGrupales += sumaTotalGrupal;
                        cantidadJuradosCerrados++;
                    }

                    divGrupal.innerHTML += `
                        <div style="background: rgba(19, 34, 71, 0.9); border: 1px solid #1e3a75; padding: 12px; border-radius: 8px; margin-bottom: 10px; color: #fff;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                <strong style="color: #60a5fa;">${nombreJurado}</strong>
                                <span style="font-size: 0.8rem; background: rgba(16,185,129,0.2); color: #34d399; padding: 2px 6px; border-radius: 4px;">${ev.estado || 'Evaluado'}</span>
                            </div>
                            <div style="font-size: 0.9rem;">${htmlCriterios || 'No hay criterios evaluados todavía.'}</div>
                            ${ev.comentario_general ? `<div style="margin-top: 6px; font-size: 0.85rem; color: #cbd5e1; font-style: italic;">Comentario: "${ev.comentario_general}"</div>` : ''}
                            <div style="margin-top: 8px; text-align: right; font-weight: bold; color: #38bdf8; font-size: 1rem; border-top: 1px solid #1e3a75; padding-top: 6px;">
                                Total Grupal: ${sumaTotalGrupal} pts
                            </div>
                        </div>
                    `;
                }

                if (cantidadJuradosCerrados > 0) {
                    const promedioFinal = sumaTotalGeneralGrupales / cantidadJuradosCerrados;
                    lblPromedioFinal.textContent = `${promedioFinal.toFixed(2)} / 100`;
                } else {
                    lblPromedioFinal.textContent = "Pendiente de cierre";
                }
            }
        } catch (error) {
            console.error("Error al cargar calificaciones del alumno:", error);
            divGrupal.innerHTML = '<p style="color: #f87171;">Ocurrió un error al cargar las notas.</p>';
        }
    }

    window.onload = async () => {
        await cargarFiltroCompetencias();
        await cargarDatosAlumno();
    };
</script>

</body>
</html>
