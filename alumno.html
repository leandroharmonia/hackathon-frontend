<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación del Alumno</title>
    <link rel="stylesheet" href="css/notas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .card-evaluacion {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border-left: 5px solid #2563eb;
        }
        .tag-estado {
            font-size: 0.78rem;
            background: #dcfce7;
            color: #16a34a;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .total-puntos {
            margin-top: 10px;
            text-align: right;
            font-weight: 800;
            color: #2563eb;
            font-size: 1.05rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="texto">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
        <div class="titulos" style="margin-bottom: 0;">
            <h3>SISTEMA DE EVALUACIÓN</h3>
            <h1>Evaluación personal y grupal</h1>
            <h4 id="nombre-grupo">Actividad: Cargando equipo...</h4>
        </div>
        <button onclick="irARankings()" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.15);">Ver Rankings</button>
    </div>

    <h3 style="color: #1e3a8a; margin-top: 20px;">Puntaje individual</h3>
    <div id="puntaje-individual" class="puntajesi">
        <p style="color: #64748b;">Cargando tu calificación individual...</p>
    </div>

    <h3 style="color: #1e3a8a; margin-top: 20px;">Puntaje grupal</h3>
    <div id="puntaje-grupal" class="puntajesg">
        <p style="color: #64748b;">Buscando calificaciones grupales de los jurados...</p>
    </div>

    <h3 style="color: #1e3a8a; margin-top: 25px;">Resumen y Promedio Final</h3>
    <div id="promedio-final">
        <p style="color: #64748b;">Calculando resultado final...</p>
    </div>

    <div style="margin-top: 25px;">
        <button onclick="cerrarSesion()" style="background: #fee2e2; color: #dc2626; border: 1px solid #f87171; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">Cerrar Sesión</button>
    </div>
</div>

<img src="img/Grupos.jpg" alt="Imagen de fondo" class="imagen-fondo">

<script>
    const SUPABASE_URL = "https://lunpcumjmkbetdccsmuo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3OiOiJzdXBhYmFzZSIsInJlZiI6Imx1bnBjdW1qbWtiZXRkY2NzbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODc1MjcsImV4cCI6MjEwNzU2MzUyN30.MyP9ADhCM8LBP7jvtRs-rUX1n-MYShBMA5qtFRMH3Xc";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuario") || "{}");
    const idUsuarioActivo = usuarioLogueado.id_usuario || usuarioLogueado.id_alumno || usuarioLogueado.id;

    if (!usuarioLogueado || usuarioLogueado.rol !== "alumno") {
        alert("Acceso denegado. Debe iniciar sesión como Alumno.");
        window.location.href = "index.html";
    }

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    function irARankings() {
        window.location.href = "rankings.html";
    }

    async function cargarDatosAlumno() {
        const divIndividual = document.getElementById('puntaje-individual');
        const divGrupal = document.getElementById('puntaje-grupal');
        const divPromedio = document.getElementById('promedio-final');
        const h4Grupo = document.getElementById('nombre-grupo');

        let listaTotalesGrupales = [];
        let idGrupoEncontrado = null;
        let nombreGrupoEncontrado = "Equipo";

        try {
            // BUSCAR ASIGNACIÓN DE GRUPO PROBANDO AMBAS COLUMNAS (id_alumno O id_usuario)
            let { data: relGrupo } = await db
                .from('grupo_integrantes')
                .select('id_grupo, grupos(nombre, id_competencia)')
                .eq('id_alumno', idUsuarioActivo)
                .maybeSingle();

            if (!relGrupo) {
                let { data: relAlt } = await db
                    .from('grupo_integrantes')
                    .select('id_grupo, grupos(nombre, id_competencia)')
                    .eq('id_usuario', idUsuarioActivo)
                    .maybeSingle();
                relGrupo = relAlt;
            }

            if (relGrupo) {
                idGrupoEncontrado = relGrupo.id_grupo;
                if (relGrupo.grupos) {
                    nombreGrupoEncontrado = relGrupo.grupos.nombre;
                    if (relGrupo.grupos.id_competencia) {
                        usuarioLogueado.id_competencia = relGrupo.grupos.id_competencia;
                        sessionStorage.setItem("usuario", JSON.stringify(usuarioLogueado));
                    }
                }
            } else if (usuarioLogueado.id_grupo) {
                idGrupoEncontrado = usuarioLogueado.id_grupo;
            }

            if (!idGrupoEncontrado) {
                h4Grupo.textContent = "Actividad: Sin grupo asignado";
                divIndividual.innerHTML = '<div class="card-evaluacion" style="border-left-color: #ef4444;"><p style="color: #dc2626; margin: 0;">No estás asignado a ningún grupo todavía.</p></div>';
                divGrupal.innerHTML = '<div class="card-evaluacion" style="border-left-color: #ef4444;"><p style="color: #dc2626; margin: 0;">Sin calificaciones disponibles.</p></div>';
                divPromedio.innerHTML = '<p style="color: #dc2626; font-weight: 600;">Sin datos para promediar.</p>';
                return;
            }

            h4Grupo.textContent = `Actividad: Evaluaciones para el equipo "${nombreGrupoEncontrado}"`;

            // 1. OBTENER CALIFICACIÓN INDIVIDUAL (DEFENSA)
            let { data: notaInd } = await db
                .from('defensa_individual')
                .select('*')
                .eq('id_alumno', idUsuarioActivo)
                .maybeSingle();

            if (!notaInd) {
                let { data: notaAlt } = await db
                    .from('defensa_individual')
                    .select('*')
                    .eq('id_usuario', idUsuarioActivo)
                    .maybeSingle();
                notaInd = notaAlt;
            }

            if (!notaInd) {
                divIndividual.innerHTML = `
                    <div class="card-evaluacion">
                        <strong style="color: #1e3a8a;">${usuarioLogueado.nombre || ''} ${usuarioLogueado.apellido || ''} (Tú)</strong>
                        <p style="margin: 6px 0 0 0; color: #64748b; font-size: 0.9rem;">Aún no tienes calificaciones individuales registradas.</p>
                    </div>
                `;
            } else {
                const totalInd = parseFloat(notaInd.puntaje || notaInd.total || notaInd.nota || 0).toFixed(1);
                divIndividual.innerHTML = `
                    <div class="card-evaluacion">
                        <strong style="color: #1e3a8a;">${usuarioLogueado.nombre || ''} ${usuarioLogueado.apellido || ''} (Tú)</strong>
                        <div class="total-puntos">
                            Puntaje Individual: ${totalInd} pts
                        </div>
                    </div>
                `;
            }

            // 2. OBTENER EVALUACIONES GRUPALES Y OBTENER EL NOMBRE DEL JURADO
            const { data: evaluaciones, error: errEval } = await db
                .from('evaluaciones')
                .select(`
                    id_evaluacion, 
                    estado, 
                    comentario_general, 
                    id_jurado,
                    usuarios:id_jurado (nombre, apellido)
                `)
                .eq('id_grupo', idGrupoEncontrado);

            if (errEval) throw errEval;

            if (!evaluaciones || evaluaciones.length === 0) {
                divGrupal.innerHTML = '<div class="card-evaluacion"><p style="color: #64748b; margin:0;">Tu equipo aún no ha recibido calificaciones grupales de los jurados.</p></div>';
                divPromedio.innerHTML = '<p style="color: #64748b;">Sin evaluaciones grupales para promediar.</p>';
            } else {
                divGrupal.innerHTML = '';
                
                for (let ev of evaluaciones) {
                    const { data: detalles } = await db
                        .from('evaluacion_detalle')
                        .select('puntaje, criterios_rubrica(nombre, puntaje_maximo)')
                        .eq('id_evaluacion', ev.id_evaluacion);

                    let htmlCriterios = '';
                    let sumaTotalGrupal = 0;

                    if (detalles && detalles.length > 0) {
                        detalles.forEach(d => {
                            const pts = parseFloat(d.puntaje) || 0;
                            sumaTotalGrupal += pts;
                            const nombreCrit = d.criterios_rubrica ? d.criterios_rubrica.nombre : 'Criterio';
                            const maxCrit = d.criterios_rubrica ? d.criterios_rubrica.puntaje_maximo : '-';
                            htmlCriterios += `<div style="margin: 5px 0; font-size: 0.9rem; color: #334155;">• ${nombreCrit}: <strong style="color: #1e3a8a;">${pts}</strong> / ${maxCrit} pts</div>`;
                        });
                    }

                    listaTotalesGrupales.push(sumaTotalGrupal);

                    let nombreJurado = 'Jurado';
                    if (ev.usuarios && ev.usuarios.nombre) {
                        nombreJurado = `${ev.usuarios.nombre} ${ev.usuarios.apellido || ''}`;
                    }

                    divGrupal.innerHTML += `
                        <div class="card-evaluacion">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <strong style="color: #1e3a8a; font-size: 1rem;">Evaluación de: ${nombreJurado}</strong>
                                <span class="tag-estado">${ev.estado || 'cerrado'}</span>
                            </div>
                            <div>${htmlCriterios || '<p style="color:#64748b; font-size:0.85rem;">Detalle de rubros no disponible...</p>'}</div>
                            ${ev.comentario_general ? `<p style="margin-top: 10px; font-style: italic; color: #475569; font-size: 0.85rem; background: #f8fafc; padding: 8px; border-radius: 6px;">"${ev.comentario_general}"</p>` : ''}
                            <div class="total-puntos">
                                Total Grupal: ${sumaTotalGrupal.toFixed(1)} pts
                            </div>
                        </div>
                    `;
                }

                // 3. PROMEDIO FINAL BASADO ÚNICAMENTE EN LAS NOTAS GRUPALES
                if (listaTotalesGrupales.length > 0) {
                    const sumaGrupales = listaTotalesGrupales.reduce((acc, curr) => acc + curr, 0);
                    const promedioGrupalFinal = (sumaGrupales / listaTotalesGrupales.length).toFixed(1);

                    divPromedio.innerHTML = `
                        <div class="card-evaluacion" style="background: #ffffff; border: 2px solid #2563eb;">
                            <div style="font-size: 0.95rem; color: #1e293b; margin-bottom: 6px;">
                                • Total de Jurados evaluadores: <strong style="color: #1e3a8a;">${listaTotalesGrupales.length}</strong>
                            </div>
                            <div style="text-align: right; border-top: 1px dashed #cbd5e1; padding-top: 10px;">
                                <span style="font-size: 1.05rem; color: #1e3a8a; font-weight: 700;">Promedio Grupal Final: </span>
                                <span style="font-size: 1.4rem; color: #2563eb; font-weight: 800;">${promedioGrupalFinal} pts</span>
                            </div>
                        </div>
                    `;
                }
            }

        } catch (error) {
            console.error("Error al cargar datos:", error);
            divGrupal.innerHTML = '<p style="color: #dc2626;">Ocurrió un error al cargar las notas.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', cargarDatosAlumno);
</script>

</body>
</html>
